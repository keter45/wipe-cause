[workspace]
members = ["crates/wipe-core", "crates/wipe-wasm", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.31.0"
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
