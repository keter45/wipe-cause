  # ---------- Fontes ----------
  - key: imbibe
    name: "Imbibe"
    type: info
    source_unit: vashnik
    severity: none
    detect: { cast_id: 1284663 }
    tip: "Levar o boss às fontes escolhidas: ele ganha as habilidades das duas mais próximas."
    message: "Imbibe"

  - key: fountain_expulsion
    name: "Conflagrating / Gloom Expulsion"
    type: unavoidable
    source_unit: vashnik
    severity: none
    detect: { damage_ids: [1298587, 1298583] }
    tip: "Dano no raid quando uma fonte é ativada."
    message: "Expulsion"

  - key: toxic_vapor
    name: "Toxic Vapor"
    type: unavoidable
    source_unit: vashnik
    severity: none
    detect: { damage_ids: [1284561] }
