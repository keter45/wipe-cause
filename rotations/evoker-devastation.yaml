# Devastation Evoker — rotação base (Midnight Season 2, patch 12.1).
# Escrita a partir do guia de rotação do Wowhead e da APL do SimulationCraft (branch midnight).
# Os textos são nossos; cooldowns e custos vêm dos tooltips do Wowhead.
# Validada no log de 29/09 (Gödmentation — Scalecommander).
#
# Sem checagem de Essence estourada: a Essence regenera sozinha e não aparece no log como ganho.
spec: 1467
name: Devastation Evoker
patch: "12.1"
sources:
  - title: Wowhead — Devastation Evoker Rotation Guide (Midnight)
    url: https://www.wowhead.com/guide/classes/evoker/devastation/rotation-cooldowns-pve-dps
  - title: SimulationCraft — APL evoker_devastation (midnight)
    url: https://github.com/simulationcraft/simc/blob/midnight/ActionPriorityLists/default/evoker_devastation.simc

# Charged Blast sai sozinho (stacks do Pyre)
ignore_casts: [370454]

key_points:
  - { pt: "Gerar e gastar: Disintegrate (Pyre em 3+ alvos) gasta Essence e Essence Burst; Living Flame e Azure Strike preenchem e dão Essence Burst.", en: "Build and spend: Disintegrate (Pyre on 3+ targets) spends Essence and Essence Burst; Living Flame and Azure Strike fill and give Essence Burst." }
  - { pt: "Dragonrage é o cooldown principal: Fire Breath e Eternity Surge dentro dele o estendem (Animosity); Tip the Scales no Eternity Surge.", en: "Dragonrage is the main cooldown: Fire Breath and Eternity Surge inside it extend it (Animosity); Tip the Scales on Eternity Surge." }
  - { pt: "Fire Breath e Eternity Surge no rank 1, e no cooldown.", en: "Fire Breath and Eternity Surge at rank 1, and on cooldown." }
  - { pt: "Scalecommander: Deep Breath no cooldown (cancele a animação assim que passar pelo alvo); cada empower libera o Mass Disintegrate.", en: "Scalecommander: Deep Breath on cooldown (cancel the animation as soon as it passes the target); each empower unlocks Mass Disintegrate." }
  - { pt: "Sempre castando: Hover para castar andando (guarde uma carga para o Dragonrage); Azure Strike é melhor do que ficar parado.", en: "Always casting: Hover to cast while moving (keep a charge for Dragonrage); Azure Strike beats standing still." }
  - { pt: "Gaste o Essence Burst antes de acumular o máximo, e o Burnout faz o próximo Living Flame instantâneo.", en: "Spend Essence Burst before it caps, and Burnout makes the next Living Flame instant." }

hero_trees:
  - key: scalecommander
    name: Scalecommander
    markers: [433874, 1261393] # Deep Breath do Scalecommander, buff Command Squadron
  - key: flameshaper
    name: Flameshaper
    markers: [] # quem não usa o Deep Breath do Scalecommander

abilities:
  dragonrage: { id: 375087, name: Dragonrage, cooldown_ms: 120000 }
  deep_breath: { id: 433874, alt_ids: [357210], name: Deep Breath, cooldown_ms: 120000, tree: scalecommander }
  tip_the_scales: { id: 370553, name: Tip the Scales, cooldown_ms: 120000 }
  eternity_surge: { id: 382411, alt_ids: [359073], name: Eternity Surge, cast_ms: 1000, cooldown_ms: 30000 }
  fire_breath: { id: 382266, alt_ids: [357208], name: Fire Breath, cast_ms: 1000, cooldown_ms: 30000 }
  disintegrate: { id: 356995, name: Disintegrate, channel_ms: 3000 }
  pyre: { id: 357211, name: Pyre }
  living_flame: { id: 361469, name: Living Flame, cast_ms: 2000 }
  azure_strike: { id: 362969, name: Azure Strike }
  hover: { id: 358267, name: Hover }

buffs:
  essence_burst: { id: 359618, name: Essence Burst }
  burnout: { id: 375802, name: Burnout }

priority:
  scalecommander:
    st:
      - { spell: hover, note: { pt: "se estiver com as cargas cheias e o Deep Breath pronto logo", en: "if the charges are full and Deep Breath is ready soon" } }
      - { spell: deep_breath, note: { pt: "no cooldown (de novo quando o Strafing Run for acabar)", en: "on cooldown (again when Strafing Run is about to end)" } }
      - { spell: dragonrage }
      - { spell: tip_the_scales }
      - { spell: eternity_surge, note: { pt: "rank 1", en: "rank 1" } }
      - { spell: fire_breath, note: { pt: "rank 1", en: "rank 1" } }
      - { spell: disintegrate, note: { pt: "com Essence Burst / Essence, Mass Disintegrate primeiro", en: "with Essence Burst / Essence, Mass Disintegrate first" } }
      - { spell: living_flame, note: { pt: "com Leaping Flames e Burnout", en: "with Leaping Flames and Burnout" } }
      - { spell: azure_strike, note: { pt: "Azure Sweep, sem estourar Essence Burst", en: "Azure Sweep, without capping Essence Burst" } }
      - { spell: living_flame, note: { pt: "preenche", en: "filler" } }
      - { spell: azure_strike, note: { pt: "no movimento", en: "while moving" } }
    aoe:
      - { spell: deep_breath }
      - { spell: dragonrage }
      - { spell: tip_the_scales, note: { pt: "no Eternity Surge", en: "on Eternity Surge" } }
      - { spell: fire_breath, note: { pt: "rank 1", en: "rank 1" } }
      - { spell: eternity_surge }
      - { spell: pyre, note: { pt: "com 18+ Charged Blast em 3+ alvos", en: "with 18+ Charged Blast on 3+ targets" } }
      - { spell: disintegrate, note: { pt: "Mass Disintegrate", en: "Mass Disintegrate" } }
      - { spell: pyre, note: { pt: "3+ alvos", en: "3+ targets" } }
      - { spell: living_flame, note: { pt: "com Leaping Flames e Burnout", en: "with Leaping Flames and Burnout" } }
      - { spell: azure_strike, note: { pt: "preenche", en: "filler" } }
  flameshaper:
    st:
      - { spell: dragonrage }
      - { spell: tip_the_scales, note: { pt: "só no Eternity Surge", en: "only on Eternity Surge" } }
      - { spell: eternity_surge }
      - { spell: fire_breath, note: { pt: "rank 1, para manter o DoT", en: "rank 1, to keep the DoT up" } }
      - { spell: disintegrate }
      - { spell: living_flame, note: { pt: "com Leaping Flames e Burnout", en: "with Leaping Flames and Burnout" } }
      - { spell: azure_strike, note: { pt: "Azure Sweep", en: "Azure Sweep" } }
      - { spell: living_flame, note: { pt: "preenche", en: "filler" } }
    aoe:
      - { spell: dragonrage }
      - { spell: tip_the_scales, note: { pt: "no Eternity Surge", en: "on Eternity Surge" } }
      - { spell: fire_breath, note: { pt: "rank 1, antes do Dragonrage", en: "rank 1, before Dragonrage" } }
      - { spell: eternity_surge }
      - { spell: pyre, note: { pt: "3+ alvos", en: "3+ targets" } }
      - { spell: disintegrate }
      - { spell: living_flame, note: { pt: "com Burnout", en: "with Burnout" } }
      - { spell: azure_strike, note: { pt: "preenche", en: "filler" } }

# Abertura: Living Flame pré-cast e os cooldowns em sequência
opener:
  window_ms: 10000
  ordered: false
  scalecommander: [deep_breath, dragonrage, tip_the_scales, eternity_surge, fire_breath]
  flameshaper: [dragonrage, tip_the_scales, eternity_surge, fire_breath]

checks:
  - kind: downtime
    id: always_be_casting
    gcd_ms: 1200
    min_gap_ms: 800
    importance: high
    title: { pt: "Tempo sem castar", en: "Time not casting" }
    tip: { pt: "Sempre castando: Hover para castar andando; Azure Strike é melhor do que ficar parado.", en: "Always casting: Hover to cast while moving; Azure Strike beats standing still." }
  - kind: proc
    id: essence_burst
    buff: essence_burst
    spenders: [disintegrate, pyre]
    importance: medium
    title: { pt: "Essence Burst perdido", en: "Essence Burst lost" }
    tip: { pt: "Essence Burst deixa o próximo Disintegrate / Pyre de graça: gaste antes de acumular no máximo ou expirar.", en: "Essence Burst makes the next Disintegrate / Pyre free: spend it before it caps or expires." }
  - kind: proc
    id: burnout
    buff: burnout
    spenders: [living_flame]
    importance: low
    title: { pt: "Burnout perdido", en: "Burnout lost" }
    tip: { pt: "Burnout deixa o próximo Living Flame instantâneo: use antes de acabar.", en: "Burnout makes the next Living Flame instant: use it before it expires." }
  - kind: cooldown
    id: cooldowns
    spells: [dragonrage, deep_breath, tip_the_scales, eternity_surge, fire_breath]
    min_usage: 0.8
    importance: medium
    title: { pt: "Cooldown parado", en: "Cooldown sitting" }
    tip: { pt: "Dragonrage, Deep Breath e os empowers (Fire Breath, Eternity Surge) no cooldown.", en: "Dragonrage, Deep Breath and the empowers (Fire Breath, Eternity Surge) on cooldown." }
