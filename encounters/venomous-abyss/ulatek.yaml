    source_unit: blightscale_viper
    severity: major
    overrides:
      mythic: { severity: wipe }
    detect:
      fail_ids: [1308275]       # Putrid Membrane: o raid todo toma quando um ovo vira Viper
    tip: { pt: "Pegar os ovos e manter longe das ondas e do veneno; ovo quebrado cedo vira filhote fraco, ovo que choca vira Viper.", en: "Pick up the eggs and keep them away from waves and venom; an egg broken early becomes a weak hatchling, one that hatches becomes a Viper." }
    message: { pt: "{count} Viper chocada — Putrid Membrane no raid", en: "{count} Viper hatched — Putrid Membrane on the raid" }
    notes: "Aura 1301268 no raid inteiro no momento em que a Viper nasce; o dano 1308275 pulsa ~19s. Duas Vipers a menos de 1,5s contam uma vez."

