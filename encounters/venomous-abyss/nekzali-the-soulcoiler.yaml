schema_version: 1
raid: venomous-abyss
boss: nekzali-the-soulcoiler
name: "Nek'zali the Soulcoiler"
encounter_id: 3470
source:
  - https://www.mythictrap.com/en/venomous-abyss/nekzali-the-soulcoiler/mythic
  - "log: Split-2026-09-26 Nek'zali the Soulcoiler Mythic (3 pulls) — IDs de dano, auras e dispels calibrados"
updated: 2026-09-29
difficulties: [normal, heroic, mythic]

units:
  - { key: nekzali, name: "Nek'zali the Soulcoiler", npc_id: null, boss: true }
  - { key: restless_amani, name: "Restless Amani", npc_id: null }
  - { key: echo_of_jawae, name: "Echo of Jawae", npc_id: null }
  - { key: drowned_echo, name: "Drowned Echo", npc_id: null }
  - { key: soulcoil_well, name: "Soulcoil Well", npc_id: null }

phases:
  - { key: p1, name: "Soulcoiler Initiation", start: pull }
  - { key: intermission, name: "Ritual of Awakening", start: { cast: ritual_of_awakening } }
  - { key: p2, name: "Uncoiling", start: { cast: uncoiling } }

mechanics:
  # ---------- Energia / enrage ----------
  - key: uncoiled_rage
    name: "Uncoiled Rage"
    type: enrage
    source_unit: nekzali
    severity: wipe
    detect: { enrage_aura_id: 1284034 }
    tip: { pt: "Cada Soulcoil Ignition e cada esqueleto que chega no poço dão energia; matar antes de encher.", en: "Every Soulcoil Ignition and every skeleton that reaches the well gives energy; kill her before it fills." }
    message: { pt: "Nek'zali encheu a energia (Uncoiled Rage)", en: "Nek'zali filled her energy (Uncoiled Rage)" }

  - key: soulcoil_well_adds
    name: "Soulcoil Well (esqueletos)"
    type: info
    source_unit: restless_amani
    severity: major
    detect: { cast_id: 1287533 }
    tip: { pt: "Focar os esqueletos e quebrar o escudo antes que cheguem ao centro; cada um que chega dá stack de Soulcoil Rite e energia.", en: "Focus the skeletons and break the shield before they reach the center; each one that arrives gives a Soulcoil Rite stack and energy." }
    message: { pt: "Esqueletos chegando ao poço", en: "Skeletons reaching the well" }
    notes: "Gravebound Advance (1287533) é a caminhada; ainda sem evento que prove que um esqueleto chegou ao poço."

  # ---------- Fase 1 ----------
  - key: soulcoil_rite
    name: "Soulcoil Rite"
    type: unavoidable
    source_unit: nekzali
    severity: none
    detect: { damage_ids: [1288772], aura_id: 1288772 }
    tip: { pt: "DoT de 5 stacks do Soulcoil Ignition; +1 stack por esqueleto que chega ao poço.", en: "5-stack DoT from Soulcoil Ignition; +1 stack per skeleton that reaches the well." }
    message: { pt: "Soulcoil Rite", en: "Soulcoil Rite" }

  - key: ritual_burn
    name: "Ritual Burn"
    type: info
    source_unit: nekzali
    difficulty: [heroic, mythic]
    severity: none
    detect: { aura_id: 1297624 }
    tip: { pt: "Vulnerabilidade acumulada junto do Soulcoil Rite; guardar cura/defensivos para os Ignitions.", en: "Vulnerability that stacks with Soulcoil Rite; save healing/defensives for the Ignitions." }
    message: { pt: "Ritual Burn", en: "Ritual Burn" }

  - key: essence_rend
    name: "Essence Rend"
    type: dispel
    source_unit: nekzali
    severity: minor
    detect: { aura_id: 1287434 }
    max_delay: 8
    tip: { pt: "Marcados vão para a borda da sala antes do dispel, para o Latent Cultist cair longe.", en: "Marked players go to the edge of the room before the dispel, so the Latent Cultist lands far away." }
    message: { pt: "{count} Essence Rend sem dispel a tempo", en: "{count} Essence Rend not dispelled in time" }
    notes: "O dispel só deve sair na borda; max_delay 8s é generoso de propósito. 1287427 é a marcação inicial (sem origem)."

  - key: latent_cultist
    name: "Latent Cultist"
    type: avoidable_damage
    source_unit: nekzali
    severity: minor
    detect: { damage_ids: [1288554, 1292899] }
    tip: { pt: "Não encostar nos Latent Cultists que flutuam pela sala.", en: "Don't touch the Latent Cultists floating around the room." }
    message: { pt: "{player} encostou em Latent Cultist ({count}x)", en: "{player} touched a Latent Cultist ({count}x)" }

  - key: anguished_echoes
    name: "Anguished Echoes"
    type: avoidable_damage
    source_unit: nekzali
    severity: minor
    detect: { damage_ids: [1294846] }
    tip: { pt: "Evitar os espíritos.", en: "Avoid the spirits." }
    message: { pt: "{player} tomou Anguished Echoes ({count}x)", en: "{player} took Anguished Echoes ({count}x)" }
    notes: "Poucos hits por pull, sempre em 1-2 players: parece evitável. Confirmar a origem no vídeo."

  - key: possession_barrage
    name: "Possession Barrage"
    type: unavoidable
    source_unit: nekzali
    severity: none
    detect: { damage_ids: [1292034], aura_id: 1284103 }
    tip: { pt: "Tank leva o boss para longe e o raid fica atrás dele; o dano cai com a distância.", en: "The tank takes the boss far away and the raid stays behind; the damage falls off with distance." }
    message: { pt: "Possession Barrage", en: "Possession Barrage" }
    notes: "O raid inteiro toma dano (queda com a distância), então não dá para culpar pelo log."

  - key: hollowing_strikes
    name: "Hollowing Strikes"
    type: stack_limit
    source_unit: nekzali
    roles: [tank]
    severity: minor
    detect: { aura_id: 1284109, damage_ids: [1284109] }
    tip: { pt: "Trocar de tank pelos stacks (DoT e cura reduzida).", en: "Tank swap on stacks (DoT and reduced healing)." }
    message: { pt: "{player} chegou a {stacks} stacks de Hollowing Strikes", en: "{player} reached {stacks} stacks of Hollowing Strikes" }
    notes: "Sem warn_stacks: calibrar o número de troca com pulls reais."

  - key: corpse_blight
    name: "Corpse Blight"
    type: unavoidable
    source_unit: restless_amani
    severity: none
    detect: { damage_ids: [1307939, 1294729], aura_id: 1307939 }
    tip: { pt: "DoT no raid quando cada esqueleto morre; espaçar as mortes ajuda a cura.", en: "Raid DoT when each skeleton dies; spacing the kills helps the healing." }
    message: { pt: "Corpse Blight", en: "Corpse Blight" }

  - key: vessel_of_awakening
    name: "Vessel of Awakening"
    type: failure_event
    source_unit: restless_amani
    difficulty: [heroic, mythic]
    severity: major
    detect: { fail_ids: [1297630] }
    tip: { pt: "Queimar os corpos dos esqueletos com as chamas antes que levantem.", en: "Burn the skeleton corpses with the flames before they rise." }
    message: { pt: "{count} vez(es) os corpos levantaram (Vessel of Awakening)", en: "Corpses rose {count} time(s) (Vessel of Awakening)" }
    notes: "No log o dano sai dos Restless Amani e pega o raid inteiro de uma vez; tratado como corpos não queimados. Confirmar."

  # ---------- Mítico: poço ----------
  - key: grasping_depths
    name: "Grasping Depths"
    type: unavoidable
    source_unit: soulcoil_well
    difficulty: [mythic]
    severity: none
    detect: { damage_ids: [1293214], aura_id: 1293214 }
    tip: { pt: "Enquanto o Drowned Echo vive o raid é puxado e toma dano; mandar o grupo do poço matar rápido.", en: "While the Drowned Echo is alive the raid is pulled and takes damage; send the well group to kill it fast." }
    message: { pt: "Grasping Depths", en: "Grasping Depths" }

  - key: soul_exhaustion
    name: "Soul Exhaustion"
    type: info
    source_unit: soulcoil_well
    difficulty: [mythic]
    severity: none
    detect: { aura_id: 1300235 }
    tip: { pt: "Quem entrou no poço fica vulnerável: alternar os grupos.", en: "Whoever went into the well becomes vulnerable: alternate groups." }
    message: { pt: "Soul Exhaustion", en: "Soul Exhaustion" }

  - key: immortal_coil
    name: "Immortal Coil"
    type: unavoidable
    source_unit: soulcoil_well
    difficulty: [mythic]
    severity: none
    detect: { damage_ids: [1308227] }
    tip: { pt: "Dano em quem está dentro do poço.", en: "Damage to whoever is inside the well." }
    message: { pt: "Immortal Coil", en: "Immortal Coil" }

  - key: swirling_spirit
    name: "Swirling Spirit"
    type: unavoidable
    source_unit: drowned_echo
    difficulty: [mythic]
    severity: none
    detect: { damage_ids: [1300239] }
    tip: { pt: "Dano do Drowned Echo em quem está no poço.", en: "Drowned Echo damage to whoever is in the well." }
    message: { pt: "Swirling Spirit", en: "Swirling Spirit" }

  - key: invoke
    name: "Invoke"
    type: info
    source_unit: nekzali
    severity: minor
    detect: { cast_id: 1299673, aura_id: 1299722 }
    tip: { pt: "Move os Latent Cultists; no Mítico, não estar castando quando sai (interrompe por 3s).", en: "Moves the Latent Cultists; on Mythic, don't be casting when it goes off (3s lockout)." }
    message: { pt: "Invoke", en: "Invoke" }

  # ---------- Intermissão ----------
  - key: ritual_of_awakening
    name: "Ritual of Awakening"
    type: info
    source_unit: nekzali
    severity: none
    detect: { cast_id: 1295124 }
    tip: { pt: "Em 50% o boss fica imune até os dois Echo of Jawae morrerem.", en: "At 50% the boss becomes immune until both Echo of Jawae die." }
    message: { pt: "Ritual of Awakening", en: "Ritual of Awakening" }

  - key: soul_transfer
    name: "Soul Transfer"
    type: avoidable_damage
    source_unit: echo_of_jawae
    severity: major
    detect: { damage_ids: [1295085] }
    tip: { pt: "Não ficar na linha entre o Echo e o boss quando o canal termina.", en: "Don't stand on the line between the Echo and the boss when the channel ends." }
    message: { pt: "{player} foi atingido pelo Soul Transfer ({count}x)", en: "{player} was hit by Soul Transfer ({count}x)" }

  - key: hungering_pyre
    name: "Hungering Pyre"
    type: unavoidable
    source_unit: echo_of_jawae
    severity: none
    detect: { damage_ids: [1289855], cast_id: 1294742 }
    tip: { pt: "Soak dividido com o tank; quem não soaka ganha Slithering Flame.", en: "Soak shared with the tank; whoever doesn't soak gets Slithering Flame." }
    message: { pt: "Hungering Pyre", en: "Hungering Pyre" }

  - key: slithering_flame
    name: "Slithering Flame"
    type: unavoidable
    source_unit: echo_of_jawae
    severity: none
    detect: { damage_ids: [1294933], aura_id: 1294933 }
    tip: { pt: "DoT em quem não soakou o Hungering Pyre; no Heroico explode e queima os corpos (Cremation).", en: "DoT on whoever didn't soak Hungering Pyre; on Heroic it explodes and burns the corpses (Cremation)." }
    message: { pt: "Slithering Flame", en: "Slithering Flame" }

  - key: cremation
    name: "Cremation"
    type: unavoidable
    source_unit: echo_of_jawae
    difficulty: [heroic, mythic]
    severity: none
    detect: { damage_ids: [1289875], aura_id: 1289875 }
    tip: { pt: "Explosão do Slithering Flame: posicionar em cima dos corpos para queimá-los.", en: "Slithering Flame explosion: position on top of the corpses to burn them." }
    message: { pt: "Cremation", en: "Cremation" }

  # ---------- Fase 2 ----------
  - key: uncoiling
    name: "Uncoiling"
    type: unavoidable
    source_unit: nekzali
    severity: none
    detect: { damage_ids: [1292315] }
    tip: { pt: "Dano pulsante no raid até o fim da luta.", en: "Pulsing raid damage until the end of the fight." }
    message: { pt: "Uncoiling", en: "Uncoiling" }
