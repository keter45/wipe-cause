  - key: noxious_ground
    name: "Noxious Ground"
    type: avoidable_damage
    source_unit: zuljan
    severity: minor
    detect: { damage_ids: [1283290] }
    ground: { lingers_s: 3, contour_cell_yd: 2 }
    # 21/10, 14 e 15/10 Mythic (17 mil posições, 1.755 ticks): a poça sai dos dois lados do altar ~4,5s depois
    # do Fangs of the Coiled Altar e fica ~22s. 1º Fangs: centros a 50 jd do meio, raio 40 (sobra um corredor
    # de 10 jd); do 2º em diante: centros a 42,5 jd, raio 42,5 (as duas se encontram no meio). Meio do altar
    # no log: x 1160, y 0. Medido cruzando quem tomou tick com quem estava perto e não tomou.
    pool:
      cast_id: 1282487
      delay_s: 4.5
      duration_s: 22
      grow_s: 3
      ends_on_phase_change: true   # o Zul'jan sai na P2: a poça do último Fangs não chega a ficar
      shapes:
        - { centers: [[1160, 50], [1160, -50]], radius: 40 }
        - { centers: [[1160, 42.5], [1160, -42.5]], radius: 42.5 }
    tolerance: 1
    tip: { pt: "Sair das poças que saem das bocas do altar.", en: "Get out of the pools coming from the altar's mouths." }
    message: { pt: "{player} tomou {count} ticks de Noxious Ground", en: "{player} took {count} ticks of Noxious Ground" }

