# Preservation Evoker — o que a spec pede (Midnight Season 2, patch 12.1). Healer não tem rotação fixa:
# aqui ficam os cooldowns e os procs que dá para cobrar sem depender do dano. Escrita a partir do guia de
# cura do Wowhead; os textos são nossos. Conferida nos logs de referência
# (samples/rotation/evoker-preservation/refs, regras em docs/healer-analysis.md), não nos tops.
spec: 1468
name: Preservation Evoker
patch: "12.1"
role: healer
sources:
  - title: Wowhead — Preservation Evoker Healing Rotation Guide (Midnight)
    url: https://www.wowhead.com/guide/classes/evoker/preservation/rotation-cooldowns-pve-healer

key_points:
  - { pt: "Temporal Anomaly no cooldown; Dream Breath logo depois de gastar os Echoes. Flameshaper deixa uma carga de Dream Breath sempre recarregando e usa a segunda no perigo.", en: "Temporal Anomaly on cooldown; Dream Breath right after consuming your Echoes. Flameshaper keeps one Dream Breath charge recharging and uses the second in danger." }
  - { pt: "Essence Burst vai no Emerald Blossom ou no Echo: não deixe acumular.", en: "Essence Burst goes into Emerald Blossom or Echo: don't let it stack up." }
  - { pt: "Echo antes do dano e gaste todos de uma vez (Merithra's Blessing quase sempre, Dream Breath às vezes).", en: "Echo before the damage and consume them all at once (Merithra's Blessing usually, Dream Breath sometimes)." }
  - { pt: "Stasis guarda Temporal Anomaly e Dream Breath para soltar no dano; Rewind no momento mais perigoso.", en: "Stasis stores Temporal Anomaly and Dream Breath to release on the damage; Rewind at the most dangerous moment." }
  - { pt: "Living Flame no tempo livre para gerar Essence Burst.", en: "Living Flame in downtime to generate Essence Burst." }

hero_trees:
  - key: chronowarden
    name: Chronowarden
    markers: [431695] # Temporal Burst
  - key: flameshaper
    name: Flameshaper
    markers: [] # quem não tem Temporal Burst

abilities:
  rewind: { id: 363534, name: Rewind, cooldown_ms: 240000 }
  stasis: { id: 370537, name: Stasis, cooldown_ms: 90000 }
  tip_the_scales: { id: 370553, name: Tip the Scales, cooldown_ms: 120000, optional: true }
  temporal_anomaly: { id: 373861, name: Temporal Anomaly, cooldown_ms: 15000, cast_ms: 1500 }
  dream_breath: { id: 355936, name: Dream Breath, alt_ids: [382614] }
  verdant_embrace: { id: 360995, name: Verdant Embrace }
  emerald_blossom: { id: 355913, name: Emerald Blossom }
  echo: { id: 364343, name: Echo }
  merithras_blessing: { id: 1256581, name: Merithra's Blessing }
  living_flame: { id: 361469, name: Living Flame, cast_ms: 2000, alt_ids: [1265991] }
  disintegrate: { id: 356995, name: Disintegrate }

buffs:
  essence_burst: { id: 369299, name: Essence Burst }

checks:
  - kind: downtime
    id: idle_with_injured
    gcd_ms: 1500
    min_gap_ms: 1000
    importance: high
    title: { pt: "Parado com gente ferida", en: "Idle while people were hurt" }
    tip: { pt: "Com alguém abaixo de 80% de vida, sempre um GCD rodando: Echo, Emerald Blossom, Living Flame para gerar Essence Burst.", en: "With someone below 80% health, always have a GCD rolling: Echo, Emerald Blossom, Living Flame to generate Essence Burst." }
  - kind: proc
    id: essence_burst
    buff: essence_burst
    spenders: [emerald_blossom, echo, disintegrate]
    importance: medium
    title: { pt: "Essence Burst perdido", en: "Essence Burst lost" }
    tip: { pt: "Essence Burst deixa o próximo Emerald Blossom ou Echo de graça: gaste antes de acabar.", en: "Essence Burst makes the next Emerald Blossom or Echo free: spend it before it expires." }
  - kind: cooldown
    id: cooldowns
    spells: [rewind, stasis, tip_the_scales]
    min_usage: 0.8
    importance: medium
    title: { pt: "Cooldown parado", en: "Cooldown sitting" }
    tip: { pt: "Rewind, Stasis e Tip the Scales o máximo de vezes que a luta deixar, nos momentos de dano.", en: "Rewind, Stasis and Tip the Scales as many times as the fight allows, at damage moments." }
  - kind: cooldown
    id: temporal_anomaly
    spells: [temporal_anomaly]
    min_usage: 0.7
    importance: low
    title: { pt: "Temporal Anomaly parado", en: "Temporal Anomaly sitting" }
    tip: { pt: "Temporal Anomaly no cooldown: põe Echo e escudo na raid.", en: "Temporal Anomaly on cooldown: it puts Echo and a shield on the raid." }

# fim do empower do Dream Breath e o segundo id do Verdant Embrace: não são botões novos
ignore_casts: [355941, 361195]
