mechanics:
  # =====================================================================
  # Fase 1 — orbs (Coalesced Venom verde / Virulent Mutation roxo)
  # =====================================================================

  # A falha que mais wipa: orb roxo encosta em outro orb (ou é carregado para perto de um)
  # e dispara 20 Venom Ruptures de uma vez. Também acontece se sobrar roxo no timer da
  # fase. No log só aparece como tick gigante de Venom Rupture (normal < 400k, explosão > 1M).
  - key: purple_detonation
    name: "Virulent Mutation (detonação)"
    type: failure_event
    source_unit: virulent_mutation
    difficulty: [mythic]
    severity: wipe
    detect:
      fail_ids: [1299838]         # Venom Rupture
      min_amount: 800000          # só a explosão; tick normal fica bem abaixo
      culprit_auras: [1310498, 1282419]  # Mutagenic Venom (roxo) / Volatile Venom (verde) consumidos na explosão
    tip: { pt: "Nunca levar orb (verde ou roxo) para perto de um roxo; roxos só morrem no frontal.", en: "Never take an orb (green or purple) near a purple one; purples only die in the frontal." }
    message: { pt: "{count} detonação(ões) de orb roxo (Venom Rupture em massa)", en: "{count} purple orb detonation(s) (mass Venom Rupture)" }
    blame_message: { pt: "{player} carregava um orb que detonou junto com um roxo", en: "{player} was carrying an orb that detonated with a purple one" }
    notes: >
      Calibrado em 6 pulls Mythic de 28/09: 4 wipes vieram disso. Culpado = quem perdeu a
      aura de portador até 0,5s antes do 1º tick gigante. Se sobrar roxo até o timer
      (boss explode todos), não há portador e a lista fica vazia.

  - key: mutagenic_venom_splash
    name: "Mutagenic Venom (perto do portador)"
    type: avoidable_damage
    source_unit: virulent_mutation
    difficulty: [mythic]
    severity: minor
    detect: { damage_ids: [1310691], excludes_aura: 1310498 }
    tolerance: 1
    tip: { pt: "Ficar a mais de 8 jardas de quem carrega o roxo.", en: "Stay more than 8 yards from whoever carries the purple." }
    message: { pt: "{player} tomou {count} ticks de Mutagenic Venom de outro portador", en: "{player} took {count} ticks of Mutagenic Venom from another carrier" }
    notes: "O portador também toma o dano; excludes_aura tira ele da conta."

  - key: volatile_venom_splash
    name: "Volatile Venom (perto do portador)"
    type: avoidable_damage
    source_unit: coalesced_venom
    severity: minor
    detect: { damage_ids: [1282288], excludes_aura: 1282419 }
    tolerance: 2
    tip: { pt: "Quem não carrega orb verde fica a mais de 5 jardas de quem carrega.", en: "Whoever isn't carrying a green orb stays more than 5 yards from the carrier." }
    message: { pt: "{player} tomou {count} ticks de Volatile Venom de outro portador", en: "{player} took {count} ticks of Volatile Venom from another carrier" }

  - key: venom_rupture
    name: "Venom Rupture"
    type: unavoidable
    source_unit: zuljan
    severity: none
    detect: { damage_ids: [1299838], aura_id: 1299838 }
    tip: { pt: "Cada orb quebrado no frontal dá 1 stack de DoT no raid; quebrar ~7 no 1º frontal de cada leva.", en: "Each orb broken in the frontal gives the raid 1 DoT stack; break ~7 in the 1st frontal of each wave." }
    message: { pt: "Venom Rupture", en: "Venom Rupture" }
    notes: "Stacks normais: 2-12 por leva. No Mythic, 20+ de uma vez = detonação (regra acima)."

