# Destruction Warlock — rotação base (Midnight Season 2, patch 12.1).
# Escrita a partir do guia de rotação do Wowhead e da APL do SimulationCraft (branch midnight).
# Os textos são nossos; cooldowns e custos vêm dos tooltips do Wowhead.
# Validada no log de 29/09 (Portallus, Rainface e Poisonlock — Hellcaller).
#
# Sem checagem de Soul Shard estourado: no Destruction os fragmentos de Soul Shard não aparecem no
# log como ganho de recurso.
spec: 267
name: Destruction Warlock
patch: "12.1"
sources:
  - title: Wowhead — Destruction Warlock Rotation Guide (Midnight)
    url: https://www.wowhead.com/guide/classes/warlock/destruction/rotation-cooldowns-pve-dps
  - title: SimulationCraft — APL warlock_destruction (midnight)
    url: https://github.com/simulationcraft/simc/blob/midnight/ActionPriorityLists/default/warlock_destruction.simc

key_points:
  - { pt: "Não estoure Soul Shards: Chaos Bolt (Shadowburn quando disponível) antes de chegar ao máximo.", en: "Don't cap Soul Shards: Chaos Bolt (Shadowburn when available) before reaching the cap." }
  - { pt: "Wither (Hellcaller) ou Immolate (Diabolist) sempre no alvo, renovando no pandemic.", en: "Wither (Hellcaller) or Immolate (Diabolist) always on the target, refreshing in pandemic." }
  - { pt: "Conflagrate para não ficar com 2 cargas, e os Backdraft que ele dá vão no Chaos Bolt.", en: "Conflagrate so it doesn't sit at 2 charges, and the Backdraft it gives goes into Chaos Bolt." }
  - { pt: "Summon Infernal e Malevolence no cooldown, e gaste todos os Soul Shards dentro deles.", en: "Summon Infernal and Malevolence on cooldown, and spend every Soul Shard inside them." }
  - { pt: "Soul Fire no cooldown com menos de 4 Soul Shards; Incinerate gera no resto.", en: "Soul Fire on cooldown at fewer than 4 Soul Shards; Incinerate builds the rest." }
  - { pt: "Diabolist: Infernal Bolt com 2 ou menos Soul Shards; Ruination no alvo com mais inimigos em volta.", en: "Diabolist: Infernal Bolt at 2 or fewer Soul Shards; Ruination on the target with the most enemies around." }

hero_trees:
  - key: hellcaller
    name: Hellcaller
    markers: [445468, 442726] # Wither, Malevolence
  - key: diabolist
    name: Diabolist
    markers: [434506, 434635] # Infernal Bolt, Ruination

abilities:
  summon_infernal: { id: 1122, name: Summon Infernal, cooldown_ms: 120000 }
  malevolence: { id: 442726, name: Malevolence, cooldown_ms: 60000, tree: hellcaller }
  soul_fire: { id: 6353, name: Soul Fire, cast_ms: 3000, cooldown_ms: 45000 }
  conflagrate: { id: 17962, name: Conflagrate, cooldown_ms: 13000, charges: 2 }
  havoc: { id: 80240, name: Havoc }
  chaos_bolt: { id: 116858, name: Chaos Bolt, cast_ms: 3000 }
  shadowburn: { id: 17877, name: Shadowburn }
  incinerate: { id: 29722, name: Incinerate, cast_ms: 2000 }
  wither: { id: 445468, name: Wither }
  immolate: { id: 348, name: Immolate }
  infernal_bolt: { id: 434506, name: Infernal Bolt, cast_ms: 2000, tree: diabolist }
  ruination: { id: 434635, name: Ruination, cast_ms: 1500, tree: diabolist }
  rain_of_fire: { id: 5740, name: Rain of Fire }

buffs:
  backdraft: { id: 117828, name: Backdraft }
  fiendish_cruelty: { id: 1245664, name: Fiendish Cruelty }
  wither: { id: 445474, name: Wither }
  immolate: { id: 157736, name: Immolate }

priority:
  hellcaller:
    st:
      - { spell: wither, note: { pt: "manter no alvo", en: "keep it on the target" } }
      - { spell: summon_infernal, note: { pt: "no cooldown", en: "on cooldown" } }
      - { spell: malevolence, note: { pt: "no cooldown", en: "on cooldown" } }
      - { spell: shadowburn, note: { pt: "quando disponível e perto de estourar Soul Shards", en: "when available and close to capping Soul Shards" } }
      - { spell: chaos_bolt, note: { pt: "para não estourar Soul Shards", en: "to avoid capping Soul Shards" } }
      - { spell: soul_fire, note: { pt: "com menos de 4 Soul Shards", en: "at fewer than 4 Soul Shards" } }
      - { spell: conflagrate, note: { pt: "para não ficar com 2 cargas, ou no movimento", en: "so it doesn't sit at 2 charges, or while moving" } }
      - { spell: conflagrate, note: { pt: "gera Soul Shard e Backdraft (gaste no Chaos Bolt)", en: "builds Soul Shard and Backdraft (spend it on Chaos Bolt)" } }
      - { spell: incinerate, note: { pt: "gera Soul Shard (preenche)", en: "builds Soul Shard (filler)" } }
    aoe:
      - { spell: wither, note: { pt: "no máximo de alvos", en: "on as many targets as possible" } }
      - { spell: malevolence, note: { pt: "com o Wither no máximo de alvos", en: "with Wither on as many targets as possible" } }
      - { spell: havoc, note: { pt: "num segundo alvo", en: "on a second target" } }
      - { spell: rain_of_fire, note: { pt: "3+ alvos sem Havoc, 5+ com Havoc", en: "3+ targets without Havoc, 5+ with Havoc" } }
      - { spell: chaos_bolt, note: { pt: "até 5 alvos com Havoc ativo", en: "up to 5 targets with Havoc up" } }
      - { spell: conflagrate }
      - { spell: incinerate }
  diabolist:
    st:
      - { spell: immolate, note: { pt: "manter no alvo", en: "keep it on the target" } }
      - { spell: summon_infernal, note: { pt: "no cooldown", en: "on cooldown" } }
      - { spell: shadowburn, note: { pt: "quando disponível e perto de estourar Soul Shards", en: "when available and close to capping Soul Shards" } }
      - { spell: chaos_bolt, note: { pt: "para não estourar; com 4+ Soul Shards e Infernal Bolt pronto", en: "to avoid capping; at 4+ Soul Shards and Infernal Bolt ready" } }
      - { spell: soul_fire, note: { pt: "com menos de 4 Soul Shards", en: "at fewer than 4 Soul Shards" } }
      - { spell: ruination, note: { pt: "quando aparecer", en: "when it procs" } }
      - { spell: infernal_bolt, note: { pt: "com 2 ou menos Soul Shards", en: "at 2 or fewer Soul Shards" } }
      - { spell: conflagrate, note: { pt: "para não ficar com 2 cargas", en: "so it doesn't sit at 2 charges" } }
      - { spell: incinerate, note: { pt: "gera Soul Shard (preenche)", en: "builds Soul Shard (filler)" } }
    aoe:
      - { spell: immolate, note: { pt: "no alvo principal e nos que vivem mais de 10s", en: "on the main target and on those living more than 10s" } }
      - { spell: havoc }
      - { spell: chaos_bolt, note: { pt: "o Diabolist sempre gasta com Chaos Bolt", en: "Diabolist always spends with Chaos Bolt" } }
      - { spell: infernal_bolt, note: { pt: "com 2 ou menos Soul Shards", en: "at 2 or fewer Soul Shards" } }
      - { spell: conflagrate }
      - { spell: incinerate }

# Abertura: Soul Fire pré-cast e os cooldowns logo de cara
opener:
  window_ms: 10000
  ordered: false
  hellcaller: [soul_fire, summon_infernal, malevolence, conflagrate]
  diabolist: [soul_fire, summon_infernal, conflagrate]

checks:
  - kind: downtime
    id: always_be_casting
    gcd_ms: 1200
    min_gap_ms: 800
    importance: high
    title: { pt: "Tempo sem castar", en: "Time not casting" }
    tip: { pt: "Sempre castando: no movimento, Conflagrate e Shadowburn; Demonic Circle e Gateway para encurtar o caminho.", en: "Always casting: while moving, Conflagrate and Shadowburn; Demonic Circle and Gateway to shorten the path." }
  - kind: dot_uptime
    id: wither
    debuff: wither
    min_uptime: 0.9
    importance: medium
    title: { pt: "Wither fora do alvo", en: "Wither off the target" }
    tip: { pt: "Wither sempre no alvo: renove no pandemic.", en: "Wither always on the target: refresh in pandemic." }
  - kind: dot_uptime
    id: immolate
    debuff: immolate
    min_uptime: 0.9
    importance: medium
    title: { pt: "Immolate fora do alvo", en: "Immolate off the target" }
    tip: { pt: "Immolate sempre no alvo: renove no pandemic.", en: "Immolate always on the target: refresh in pandemic." }
  - kind: proc
    id: backdraft
    buff: backdraft
    spenders: [chaos_bolt, incinerate, soul_fire]
    importance: low
    title: { pt: "Backdraft perdido", en: "Backdraft lost" }
    tip: { pt: "O Backdraft do Conflagrate acelera o próximo Chaos Bolt: não deixe expirar.", en: "Conflagrate's Backdraft speeds up the next Chaos Bolt: don't let it expire." }
  # pelos tops (29 lutas): gastam o Fiendish Cruelty em 100% das vezes
  - kind: proc
    id: fiendish_cruelty
    buff: fiendish_cruelty
    spenders: [shadowburn]
    importance: medium
    title: { pt: "Fiendish Cruelty perdido", en: "Fiendish Cruelty lost" }
    tip: { pt: "Com Fiendish Cruelty, o próximo Shadowburn sai mais forte: gaste antes dos 30s acabarem.", en: "With Fiendish Cruelty, the next Shadowburn hits harder: spend it before the 30s run out." }
  - kind: cooldown
    id: cooldowns
    spells: [summon_infernal, malevolence, soul_fire, conflagrate]
    min_usage: 0.8
    importance: medium
    title: { pt: "Cooldown parado", en: "Cooldown sitting" }
    tip: { pt: "Summon Infernal e Malevolence no cooldown; Soul Fire e Conflagrate sem ficar parados.", en: "Summon Infernal and Malevolence on cooldown; Soul Fire and Conflagrate never sitting." }
