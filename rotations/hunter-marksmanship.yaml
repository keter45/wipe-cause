# Marksmanship Hunter — rotação base (Midnight Season 2, patch 12.1).
# Escrita a partir do guia de rotação do Wowhead (TheAzortharion, 2026-08-24) e da APL do
# SimulationCraft (branch midnight). Os textos são nossos; os números (cooldowns, cargas) vêm
# dos tooltips do Wowhead. Validada no log de 29/09 (Kuraa, Antithesis, Bettaozor — Sentinel).
spec: 254
name: Marksmanship Hunter
patch: "12.1"
sources:
  - title: Wowhead — Marksmanship Hunter Rotation Guide (Midnight)
    url: https://www.wowhead.com/guide/classes/hunter/marksmanship/rotation-cooldowns-pve-dps
  - title: SimulationCraft — APL hunter_marksmanship (midnight)
    url: https://github.com/simulationcraft/simc/blob/midnight/ActionPriorityLists/default/hunter_marksmanship.simc

# O que mais pesa no dano, em ordem (aparece no app como "pontos principais")
key_points:
  - { pt: "Sempre castando: tempo parado é a maior perda de dano. Steady Shot preenche e dá para castar andando.", en: "Always casting: idle time is the biggest damage loss. Steady Shot fills and can be cast while moving." }
  - { pt: "Todo Precise Shots é gasto: depois de cada Aimed Shot vem um spender (Arcane Shot; Multi-Shot com 2+ alvos; Kill Shot no Sentinel, Black Arrow no Dark Ranger). Rapid Fire gasta o próprio (Unload).", en: "Every Precise Shots is spent: each Aimed Shot is followed by a spender (Arcane Shot; Multi-Shot on 2+ targets; Kill Shot for Sentinel, Black Arrow for Dark Ranger). Rapid Fire spends its own (Unload)." }
  - { pt: "Aimed Shot, Rapid Fire, Explosive Shot (duas vezes seguidas, Unstable Trigger), Volley e Trueshot no cooldown.", en: "Aimed Shot, Rapid Fire, Explosive Shot (twice in a row, Unstable Trigger), Volley and Trueshot on cooldown." }
  - { pt: "Em AoE com Trick Shots: nunca Aimed Shot ou Rapid Fire sem o buff Trick Shots (o Multi-Shot coloca).", en: "In AoE with Trick Shots: never Aimed Shot or Rapid Fire without the Trick Shots buff (Multi-Shot applies it)." }
  - { pt: "Trueshot: o último da luta espera 30 stacks de Bullseye. Sentinel: Moonlight Chakram com ~5 s de Trueshot restando.", en: "Trueshot: the last one of the fight waits for 30 Bullseye stacks. Sentinel: Moonlight Chakram with ~5 s of Trueshot left." }
  - { pt: "Mover só fora do cast de Aimed Shot.", en: "Move only outside the Aimed Shot cast." }

# Árvore de herói, reconhecida pelo que o player casta na luta
hero_trees:
  - key: sentinel
    name: Sentinel
    markers: [1264949] # Moonlight Chakram
  - key: dark_ranger
    name: Dark Ranger
    markers: [466930] # Black Arrow

abilities:
  aimed_shot: { id: 19434, name: Aimed Shot, cast_ms: 2500, cooldown_ms: 15000, charges: 2 }
  rapid_fire: { id: 257044, name: Rapid Fire, channel_ms: 2000, cooldown_ms: 16000 }
  explosive_shot: { id: 212431, name: Explosive Shot, cooldown_ms: 30000, uses_per_cooldown: 2 }
  volley: { id: 260243, name: Volley, cooldown_ms: 45000 }
  trueshot: { id: 288613, name: Trueshot, cooldown_ms: 120000 }
  arcane_shot: { id: 185358, name: Arcane Shot }
  multishot: { id: 257620, name: Multi-Shot }
  kill_shot: { id: 53351, name: Kill Shot }
  black_arrow: { id: 466930, name: Black Arrow }
  wailing_arrow: { id: 392060, name: Wailing Arrow }
  moonlight_chakram: { id: 1264949, name: Moonlight Chakram }
  steady_shot: { id: 56641, name: Steady Shot, cast_ms: 1800 }

buffs:
  precise_shots: { id: 260242, name: Precise Shots }
  trick_shots: { id: 257622, name: Trick Shots }
  unstable_trigger: { id: 1301778, name: Unstable Trigger }
  lock_and_load: { id: 194594, name: Lock and Load }
  trueshot: { id: 288613, name: Trueshot }
  bullseye: { id: 204090, name: Bullseye }

# Prioridade (do mais para o menos importante), por árvore. Mostrada no app com os ícones.
priority:
  sentinel:
    st:
      - { spell: explosive_shot, note: { pt: "no cooldown; duas vezes seguidas (Unstable Trigger)", en: "on cooldown; twice in a row (Unstable Trigger)" } }
      - { spell: volley, note: { pt: "no cooldown", en: "on cooldown" } }
      - { spell: trueshot, note: { pt: "no cooldown; o último da luta com 30 stacks de Bullseye", en: "on cooldown; the last one of the fight at 30 Bullseye stacks" } }
      - { spell: moonlight_chakram, note: { pt: "com ~5 s de Trueshot restando", en: "with ~5 s of Trueshot left" } }
      - { spell: rapid_fire, note: { pt: "no cooldown", en: "on cooldown" } }
      - { spell: kill_shot, note: { pt: "para gastar Precise Shots", en: "to spend Precise Shots" } }
      - { spell: arcane_shot, note: { pt: "para gastar Precise Shots", en: "to spend Precise Shots" } }
      - { spell: aimed_shot, note: { pt: "no cooldown", en: "on cooldown" } }
      - { spell: moonlight_chakram, note: { pt: "quando nada acima estiver pronto", en: "when nothing above is ready" } }
      - { spell: steady_shot, note: { pt: "preenche; nunca ficar parado", en: "filler; never stand still" } }
    aoe:
      - { spell: explosive_shot, note: { pt: "no cooldown, os dois em alvos diferentes", en: "on cooldown, both on different targets" } }
      - { spell: volley, note: { pt: "no cooldown", en: "on cooldown" } }
      - { spell: trueshot, note: { pt: "no cooldown", en: "on cooldown" } }
      - { spell: moonlight_chakram, note: { pt: "se o Trueshot estiver acabando", en: "if Trueshot is ending" } }
      - { spell: multishot, note: { pt: "gasta Precise Shots e recoloca Trick Shots", en: "spends Precise Shots and reapplies Trick Shots" } }
      - { spell: rapid_fire, note: { pt: "com Trick Shots; cortar o último tick com Multi-Shot", en: "with Trick Shots; clip the last tick with Multi-Shot" } }
      - { spell: aimed_shot, note: { pt: "no cooldown, com Trick Shots", en: "on cooldown, with Trick Shots" } }
      - { spell: moonlight_chakram }
      - { spell: steady_shot }
  dark_ranger:
    st:
      - { spell: black_arrow, note: { pt: "com Precise Shots", en: "with Precise Shots" } }
      - { spell: explosive_shot, note: { pt: "no cooldown; duas vezes seguidas (Unstable Trigger)", en: "on cooldown; twice in a row (Unstable Trigger)" } }
      - { spell: volley, note: { pt: "no cooldown", en: "on cooldown" } }
      - { spell: aimed_shot, note: { pt: "no Trueshot sem Precise Shots se Black Arrow estiver pronto, ou para não estourar as 2 cargas", en: "in Trueshot without Precise Shots if Black Arrow is ready, or to avoid capping the 2 charges" } }
      - { spell: trueshot, note: { pt: "no cooldown; o último da luta com 30 stacks de Bullseye", en: "on cooldown; the last one of the fight at 30 Bullseye stacks" } }
      - { spell: rapid_fire, note: { pt: "no cooldown", en: "on cooldown" } }
      - { spell: wailing_arrow, note: { pt: "no cooldown", en: "on cooldown" } }
      - { spell: arcane_shot, note: { pt: "para gastar Precise Shots", en: "to spend Precise Shots" } }
      - { spell: aimed_shot, note: { pt: "no cooldown", en: "on cooldown" } }
      - { spell: black_arrow }
      - { spell: steady_shot, note: { pt: "preenche; nunca ficar parado", en: "filler; never stand still" } }
    aoe:
      - { spell: explosive_shot, note: { pt: "no cooldown, os dois em alvos diferentes", en: "on cooldown, both on different targets" } }
      - { spell: volley, note: { pt: "no cooldown", en: "on cooldown" } }
      - { spell: aimed_shot, note: { pt: "com Trick Shots, se for chegar a 2 cargas", en: "with Trick Shots, if it would reach 2 charges" } }
      - { spell: black_arrow, note: { pt: "com Precise Shots", en: "with Precise Shots" } }
      - { spell: multishot, note: { pt: "para ativar Trick Shots se estiver sem", en: "to apply Trick Shots if it's missing" } }
      - { spell: trueshot, note: { pt: "no cooldown", en: "on cooldown" } }
      - { spell: rapid_fire, note: { pt: "com Trick Shots", en: "with Trick Shots" } }
      - { spell: wailing_arrow, note: { pt: "se Black Arrow não estiver pronto", en: "if Black Arrow isn't ready" } }
      - { spell: multishot, note: { pt: "para gastar Precise Shots", en: "to spend Precise Shots" } }
      - { spell: aimed_shot, note: { pt: "no cooldown, com Trick Shots", en: "on cooldown, with Trick Shots" } }
      - { spell: black_arrow }
      - { spell: steady_shot }

# Abertura: o Aimed Shot é pré-cast (~2,5 s antes do pull) e os cooldowns logo em seguida.
# Pelos tops (36 lutas, todos Sentinel): Aimed Shot, Explosive Shot, Trueshot e Rapid Fire em até 12s
# em 100%, em ordens variadas; o Volley e o segundo Explosive Shot nem sempre saem nessa janela
opener:
  window_ms: 12000
  ordered: false
  sentinel: [aimed_shot, explosive_shot, trueshot, rapid_fire]
  dark_ranger: [black_arrow, explosive_shot, volley, trueshot]

checks:
  - kind: proc
    id: precise_shots
    buff: precise_shots
    spenders: [arcane_shot, multishot, kill_shot, black_arrow]
    # com Unload, o Rapid Fire gasta o próprio Precise Shots durante o canal
    channel: { spell: rapid_fire, ms: 3500 }
    importance: high
    title: { pt: "Precise Shots desperdiçado", en: "Precise Shots wasted" }
    tip: { pt: "Depois de cada Aimed Shot, gaste o Precise Shots (Arcane Shot, ou Multi-Shot com 2+ alvos) antes do próximo Aimed Shot.", en: "After each Aimed Shot, spend Precise Shots (Arcane Shot, or Multi-Shot on 2+ targets) before the next Aimed Shot." }
  - kind: proc
    id: unstable_trigger
    buff: unstable_trigger
    spenders: [explosive_shot]
    importance: medium
    title: { pt: "Segundo Explosive Shot perdido", en: "Second Explosive Shot lost" }
    tip: { pt: "Com Unstable Trigger, o Explosive Shot sai duas vezes seguidas: use o segundo logo em seguida.", en: "With Unstable Trigger, Explosive Shot goes out twice in a row: use the second one right away." }
  - kind: requires_buff
    id: trick_shots
    casts: [aimed_shot, rapid_fire]
    buff: trick_shots
    min_targets: 3
    # só quem joga o talento Trick Shots (o Multi-Shot coloca o buff); sem ele (Aspect of the Hydra),
    # o Trick Shots que aparece vem do Volley e não é exigido
    applied_by: [multishot]
    importance: high
    title: { pt: "Aimed Shot / Rapid Fire sem Trick Shots em AoE", en: "Aimed Shot / Rapid Fire without Trick Shots in AoE" }
    tip: { pt: "Com 3+ alvos, Multi-Shot antes para colocar Trick Shots: sem ele, o tiro acerta só um.", en: "On 3+ targets, Multi-Shot first to apply Trick Shots: without it, the shot hits only one." }
  - kind: downtime
    id: always_be_casting
    gcd_ms: 1200
    min_gap_ms: 800
    importance: high
    title: { pt: "Tempo sem castar", en: "Time not casting" }
    tip: { pt: "Sempre castando: se nada estiver pronto, Steady Shot (dá para castar andando).", en: "Always casting: if nothing is ready, Steady Shot (castable while moving)." }
  - kind: cooldown
    id: cooldowns
    # Aimed Shot e Rapid Fire ficam de fora: haste, Trueshot e Lock and Load mudam o cooldown deles
    # (o "no cooldown" deles aparece no tempo parado e nos procs)
    spells: [trueshot, volley, explosive_shot]
    # tops: Volley com mediana 86% e p25 79%
    min_usage: 0.8
    importance: medium
    title: { pt: "Cooldown parado", en: "Cooldown sitting" }
    tip: { pt: "Use no cooldown: cada uso a menos é dano que não volta.", en: "Use it on cooldown: every missed use is damage you don't get back." }
