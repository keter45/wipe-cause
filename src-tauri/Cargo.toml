[package]
name = "wipe-cause-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Wipe Cause — app desktop"

[lib]
name = "wipe_cause_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
flate2 = "1"
serde.workspace = true
serde_json.workspace = true
wipe-core = { path = "../crates/wipe-core" }
ureq = { version = "2", features = ["json"] }
base64 = "0.23.1"
keyring = { version = "3", features = ["windows-native"] }
sha2 = "0.10"
getrandom = "0.3"
tiny_http = "0.12"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-notification = "2.5.0"
tauri-plugin-process = "2.4.0"
tauri-plugin-updater = "2.13.0"

# o túnel do link de visualização morre junto com o app (Job Object)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
