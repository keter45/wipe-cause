mechanics:
  # =====================================================================
  # Fase 1 — orbs (Coalesced Venom verde / Virulent Mutation roxo)
  # =====================================================================

  # A falha que mais wipa: um orb chega perto de um roxo e dispara a explosão. Só explode com
  # um dos dois no chão (dois carregados por players diferentes não detonam). Também acontece
  # se sobrar roxo no timer. No log só aparece como tick gigante de Venom Rupture no raid
  # (normal < 400k, explosão ~1M+).
  - key: purple_detonation
    name: "Virulent Mutation (detonation)"
    type: failure_event
    source_unit: virulent_mutation
    difficulty: [mythic]
    severity: wipe
    detect:
      fail_ids: [1299838]         # Venom Rupture
      min_amount: 800000          # só a explosão; tick normal fica bem abaixo
      confirm_aura: 1299838       # a explosão aplica stack de Venom Rupture; os ticks seguintes do DoT (também ~1M) não
      orbs:
        contact_yd: 7               # raio 6yd + 1 de folga (posição do log)
        before:
          - { until: "2026-10-13T15:00", contact_yd: 9 }   # antes do hotfix: raio 8yd
        window_ms: 500
        breaker: { cast_id: 1299684, cast_ids: [1307292], count_aura: 1299838, half_angle: 40, range: 40 }   # Sever (e o Blighted Sever da P3) quebra os orbs no cone; o raid ganha 1 stack de Venom Rupture por orb quebrado
        cleared_by: [1299960]          # Toxic Deluge: só os voláteis (roxos) restantes explodem; verdes continuam
        cleared_on_zero: [257911]      # e quando o Zul'jan chega a 0 de vida (fim da P1, antes do Dreadmarch)
        kinds:
          - { npc_id: 271982, carry_aura: 1310498, volatile: true, name: { pt: roxo, en: purple } }   # Virulent Mutation / Mutagenic Venom
          - { npc_id: 268042, carry_aura: 1282419, name: { pt: verde, en: green } }                   # Coalesced Venom Stalker / Volatile Venom
    tip: { pt: "Nunca levar orb (verde ou roxo) para perto de um roxo no chão, nem largar orb perto de um; roxos só morrem no frontal.", en: "Never take an orb (green or purple) near a purple on the ground, or drop one near it; purples only die in the frontal." }
    message: { pt: "{count} detonação(ões) de orb roxo (Venom Rupture em massa)", en: "{count} purple orb detonation(s) (mass Venom Rupture)" }
    notes: >
      Carregar = debuff de 5s; quando acaba (ou o portador morre), o orb cai onde ele está e o
      log mostra a unidade nova com posição. O Sever quebra os parados num cone de ~40°/40yd
      (bate em 73% dos Severs com o salto de stacks de Venom Rupture). Culpado = quem passou
      carregando um orb a até 7yd de outro parado (9yd antes do hotfix de 13/10, quando o raio era 8) (um deles roxo), ou largou um em cima, nos
      0,5s antes da explosão. A unidade do orb recém-largado pode aparecer até 150ms depois
      do dano (na noite de 29/10, 2ms depois); a atribuição também considera essa queda.
      O caminho do portador é a linha reta entre as posições do log,
      inclusive em teleporte (Blink, Heroic Leap...): teleportar com um orb no caminho também
      detona. Calibrado em 37 explosões de 28/09, 05/10 e 08/10 (sem contar os ticks
      seguintes do DoT): culpado em 22; o resto fica sem culpado (sobrou roxo no timer, ou
      ninguém perto o bastante).

