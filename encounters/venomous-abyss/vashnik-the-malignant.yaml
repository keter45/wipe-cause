    message: "Toxic Vapor"

  # ---------- Mítico: tumores ----------
  - key: malignance
    name: "Malignance"
    type: failure_event
    source_unit: malignant_totem
    difficulty: [mythic]
    severity: wipe
    detect: { fail_ids: [1304459] }
    tip: "Destruir todos os Malignant Tumors com as ondas da Plague Froth; tumor que sobra pulsa no raid até wipar."
    message: "{count} pulso(s) de Malignance — tumor não destruído"

  # ---------- Plague Froth ----------
  - key: plague_froth
    name: "Plague Froth"
    type: unavoidable
    source_unit: vashnik
    severity: none
    detect: { damage_ids: [1281925], aura_id: 1281913 }
    tip: "Marcados com a cruz se espalham; as ondas saem nas direções marcadas."
    message: "Plague Froth"

  - key: plague_wave
    name: "Plague Wave"
    type: avoidable_damage
    source_unit: vashnik
    severity: minor
    detect: { damage_ids: [1295798] }
    tip: "Espalhar e sair da direção das ondas (no Mítico, mirar as ondas nos tumores)."
    message: "{player} foi atingido por Plague Wave ({count}x)"

  # ---------- Malignant Catalyst (Heroico+) ----------
  - key: malignant_catalyst
    name: "Malignant Catalyst"
    type: soak
    source_unit: vashnik
    difficulty: [heroic, mythic]
    severity: major
    detect:
      damage_ids: [1282602]     # Catalytic Bile em quem soaka
      fail_ids: [1282616]       # círculo sem ninguém: explode no raid todo
    tip: "Ter alguém em cada círculo de soak."
