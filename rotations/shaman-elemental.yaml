# Elemental Shaman — rotação base (Midnight Season 2, patch 12.1).
# Escrita a partir do guia de rotação do Wowhead (HawkCorrig) e da APL do SimulationCraft
# (branch midnight). Os textos são nossos; cooldowns e custos vêm dos tooltips do Wowhead.
# Validada no log de 29/09 (Limamaria e Zerokis — Farseer).
spec: 262
name: Elemental Shaman
patch: "12.1"
sources:
  - title: Wowhead — Elemental Shaman Rotation Guide (Midnight)
    url: https://www.wowhead.com/guide/classes/shaman/elemental/rotation-cooldowns-pve-dps
  - title: SimulationCraft — APL shaman_elemental (midnight)
    url: https://github.com/simulationcraft/simc/blob/midnight/ActionPriorityLists/default/shaman_elemental.simc

key_points:
  - { pt: "Não desperdiçar Maelstrom: gaste com Elemental Blast / Earth Shock (Earthquake em AoE) antes de chegar ao máximo.", en: "Don't waste Maelstrom: spend with Elemental Blast / Earth Shock (Earthquake in AoE) before reaching the cap." }
  - { pt: "Sempre castando: o Elemental quase não tem mobilidade. Planeje o movimento e use Spiritwalker's Grace e Nature's Swiftness nos momentos de andar.", en: "Always casting: Elemental has almost no mobility. Plan movement and use Spiritwalker's Grace and Nature's Swiftness when you need to move." }
  - { pt: "Reaja aos procs: Lava Surge vira um Lava Burst instantâneo; Master of the Elements vai no feitiço mais forte (Elemental Blast, Earth Shock, Tempest).", en: "React to procs: Lava Surge becomes an instant Lava Burst; Master of the Elements goes on the strongest spell (Elemental Blast, Earth Shock, Tempest)." }
  - { pt: "Stormkeeper no cooldown e o Ascendance logo depois dele. Farseer: Stormkeeper → Ancestral Swiftness → Voltaic Blaze → Ascendance.", en: "Stormkeeper on cooldown and Ascendance right after it. Farseer: Stormkeeper → Ancestral Swiftness → Voltaic Blaze → Ascendance." }
  - { pt: "Flame Shock sempre no alvo: renove na janela de pandemic (últimos 30% da duração).", en: "Flame Shock always on the target: refresh in the pandemic window (last 30% of the duration)." }
  - { pt: "A partir de 2 alvos, Chain Lightning no lugar de Lightning Bolt; Earthquake com 3+ (Farseer) ou 4+ (Stormbringer).", en: "From 2 targets, Chain Lightning instead of Lightning Bolt; Earthquake on 3+ (Farseer) or 4+ (Stormbringer)." }

hero_trees:
  - key: farseer
    name: Farseer
    markers: [443454] # Ancestral Swiftness
  - key: stormbringer
    name: Stormbringer
    markers: [452201] # Tempest

abilities:
  stormkeeper: { id: 191634, name: Stormkeeper, cast_ms: 1500, cooldown_ms: 60000 }
  ascendance: { id: 114050, name: Ascendance, cooldown_ms: 180000 }
  ancestral_swiftness: { id: 443454, name: Ancestral Swiftness, cooldown_ms: 30000, tree: farseer }
  voltaic_blaze: { id: 470057, name: Voltaic Blaze, cooldown_ms: 10000 }
  lava_burst: { id: 51505, name: Lava Burst, cast_ms: 2000 }
  elemental_blast: { id: 117014, name: Elemental Blast, cast_ms: 2000 }
  earth_shock: { id: 8042, name: Earth Shock }
  earthquake: { id: 61882, name: Earthquake }
  earthquake_target: { id: 462620, name: Earthquake }
  lightning_bolt: { id: 188196, name: Lightning Bolt, cast_ms: 2000 }
  chain_lightning: { id: 188443, name: Chain Lightning, cast_ms: 2000 }
  tempest: { id: 452201, name: Tempest, cast_ms: 2000 }
  flame_shock: { id: 188389, name: Flame Shock }

buffs:
  lava_surge: { id: 77762, name: Lava Surge }
  master_of_the_elements: { id: 260734, name: Master of the Elements }
  stormkeeper: { id: 191634, name: Stormkeeper }
  call_of_the_ancestors: { id: 447244, name: Call of the Ancestors }
  flame_shock: { id: 188389, name: Flame Shock }
  purging_flames: { id: 1259491, name: Purging Flames }

priority:
  farseer:
    st:
      - { spell: stormkeeper, note: { pt: "no cooldown", en: "on cooldown" } }
      - { spell: ancestral_swiftness, note: { pt: "no cooldown", en: "on cooldown" } }
      - { spell: ascendance, note: { pt: "perto do cooldown, sempre depois do Stormkeeper", en: "near cooldown, always after Stormkeeper" } }
      - { spell: elemental_blast, note: { pt: "com Overcharge! (tier), perto do máximo de Maelstrom ou com Master of the Elements", en: "with Overcharge! (tier), near max Maelstrom or with Master of the Elements" } }
      - { spell: earth_shock, note: { pt: "mesmas condições, se não usar Elemental Blast", en: "same conditions, if not using Elemental Blast" } }
      - { spell: lava_burst, note: { pt: "sem Master of the Elements ativo", en: "without Master of the Elements up" } }
      - { spell: lightning_bolt, note: { pt: "para gastar Master of the Elements", en: "to spend Master of the Elements" } }
      - { spell: flame_shock, note: { pt: "renovar no pandemic, sem Master of the Elements", en: "refresh in pandemic, without Master of the Elements" } }
      - { spell: voltaic_blaze, note: { pt: "renova o Flame Shock", en: "refreshes Flame Shock" } }
      - { spell: lightning_bolt, note: { pt: "preenche", en: "filler" } }
    aoe:
      - { spell: stormkeeper, note: { pt: "no cooldown", en: "on cooldown" } }
      - { spell: ancestral_swiftness, note: { pt: "perto do cooldown", en: "near cooldown" } }
      - { spell: ascendance, note: { pt: "depois do Stormkeeper", en: "after Stormkeeper" } }
      - { spell: earthquake, note: { pt: "3+ alvos", en: "3+ targets" } }
      - { spell: elemental_blast, note: { pt: "2 alvos", en: "2 targets" } }
      - { spell: lava_burst, note: { pt: "com Lava Surge e Purging Flames", en: "with Lava Surge and Purging Flames" } }
      - { spell: voltaic_blaze, note: { pt: "no cooldown", en: "on cooldown" } }
      - { spell: chain_lightning, note: { pt: "preenche", en: "filler" } }
  stormbringer:
    st:
      - { spell: stormkeeper, note: { pt: "no cooldown", en: "on cooldown" } }
      - { spell: ascendance, note: { pt: "perto do cooldown, sempre depois do Stormkeeper", en: "near cooldown, always after Stormkeeper" } }
      - { spell: flame_shock, note: { pt: "renovar no pandemic", en: "refresh in pandemic" } }
      - { spell: voltaic_blaze, note: { pt: "renova o Flame Shock", en: "refreshes Flame Shock" } }
      - { spell: lava_burst, note: { pt: "sem estourar Maelstrom; com Lava Surge", en: "without capping Maelstrom; with Lava Surge" } }
      - { spell: tempest, note: { pt: "para gastar Master of the Elements", en: "to spend Master of the Elements" } }
      - { spell: lightning_bolt, note: { pt: "com Stormkeeper, para gastar Master of the Elements", en: "with Stormkeeper, to spend Master of the Elements" } }
      - { spell: elemental_blast }
      - { spell: earth_shock }
      - { spell: lightning_bolt, note: { pt: "preenche (ou Tempest)", en: "filler (or Tempest)" } }
    aoe:
      - { spell: stormkeeper, note: { pt: "no cooldown", en: "on cooldown" } }
      - { spell: ascendance, note: { pt: "depois do Stormkeeper", en: "after Stormkeeper" } }
      - { spell: earthquake, note: { pt: "4+ alvos", en: "4+ targets" } }
      - { spell: elemental_blast, note: { pt: "3 alvos ou menos", en: "3 targets or fewer" } }
      - { spell: voltaic_blaze, note: { pt: "renova o Flame Shock", en: "refreshes Flame Shock" } }
      - { spell: chain_lightning, note: { pt: "preenche (ou Tempest)", en: "filler (or Tempest)" } }

# Abertura: empilhar os cooldowns nos primeiros segundos (a ordem entre eles varia: o guia e a
# dica avançada dão ordens diferentes)
# Pelos tops (36 lutas, todos Farseer): Ancestral Swiftness e Ascendance em até 12s em 83%; o Stormkeeper
# e o Lava Burst ficam fora dessa janela em muitos deles, então não entram na conta
opener:
  window_ms: 12000
  ordered: false
  farseer: [ancestral_swiftness, ascendance]
  stormbringer: [stormkeeper, ascendance, lava_burst]

checks:
  - kind: resource_waste
    id: maelstrom
    power_type: 11
    resource: Maelstrom
    importance: high
    title: { pt: "Maelstrom desperdiçado", en: "Maelstrom wasted" }
    tip: { pt: "Gaste antes de chegar ao máximo: Elemental Blast / Earth Shock (Earthquake em AoE) quando faltar ~15 para o teto.", en: "Spend before reaching the cap: Elemental Blast / Earth Shock (Earthquake in AoE) when ~15 from the cap." }
  - kind: downtime
    id: always_be_casting
    gcd_ms: 1200
    min_gap_ms: 800
    importance: high
    title: { pt: "Tempo sem castar", en: "Time not casting" }
    tip: { pt: "Sempre castando: use Spiritwalker's Grace e Nature's Swiftness para castar andando; se precisar mover, instantâneos (Flame Shock, Lava Surge).", en: "Always casting: use Spiritwalker's Grace and Nature's Swiftness to cast while moving; if you must move, instants (Flame Shock, Lava Surge)." }
  - kind: proc
    id: lava_surge
    buff: lava_surge
    spenders: [lava_burst]
    importance: medium
    title: { pt: "Lava Surge perdido", en: "Lava Surge lost" }
    tip: { pt: "Lava Surge deixa o próximo Lava Burst instantâneo: use antes de acabar.", en: "Lava Surge makes the next Lava Burst instant: use it before it expires." }
  # tops: nunca perdem (mediana e p25 100%)
  - kind: proc
    id: purging_flames
    buff: purging_flames
    spenders: [lava_burst]
    importance: low
    title: { pt: "Purging Flames perdido", en: "Purging Flames lost" }
    tip: { pt: "Purging Flames fortalece o próximo Lava Burst: gaste antes de acabar.", en: "Purging Flames empowers the next Lava Burst: spend it before it expires." }
  - kind: dot_uptime
    id: flame_shock
    debuff: flame_shock
    min_uptime: 0.9
    importance: medium
    title: { pt: "Flame Shock fora do alvo", en: "Flame Shock off the target" }
    tip: { pt: "Mantenha o Flame Shock no alvo: renove (ou Voltaic Blaze) nos últimos 30% da duração.", en: "Keep Flame Shock on the target: refresh it (or Voltaic Blaze) in the last 30% of its duration." }
  - kind: aoe_swap
    id: chain_lightning
    casts: [lightning_bolt]
    instead: [chain_lightning]
    min_targets: 2
    unless_buff: stormkeeper
    importance: medium
    title: { pt: "Lightning Bolt em AoE", en: "Lightning Bolt in AoE" }
    tip: { pt: "Com 2+ alvos, Chain Lightning no lugar de Lightning Bolt.", en: "On 2+ targets, Chain Lightning instead of Lightning Bolt." }
  - kind: cooldown
    id: cooldowns
    spells: [stormkeeper, ascendance, ancestral_swiftness]
    min_usage: 0.8
    importance: medium
    title: { pt: "Cooldown parado", en: "Cooldown sitting" }
    tip: { pt: "Stormkeeper e Ancestral Swiftness no cooldown; Ascendance logo depois do Stormkeeper.", en: "Stormkeeper and Ancestral Swiftness on cooldown; Ascendance right after Stormkeeper." }
