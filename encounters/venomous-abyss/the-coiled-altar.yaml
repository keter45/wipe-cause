  # =====================================================================
  # Fase 2 — Malacrass
  # =====================================================================
  - key: dreadmarch
    name: "Dreadmarch"
    type: info
    source_unit: malacrass
    severity: major
    detect: { cast_id: 1285643, aura_id: 1297445 }
    tip: { pt: "Quebrar o absorb dos possuídos na hora (tank ajuda com burst); senão eles caem da plataforma.", en: "Break the possessed players' absorb right away (the tank helps with burst); otherwise they fall off the platform." }
    message: { pt: "Dreadmarch", en: "Dreadmarch" }
    notes: "Falha vira morte por queda (regra global de ambiente). Sem ID de 'possuído caiu'."

  - key: unnerving_fixation
    name: "Manifestation of Dread"
    type: info
    source_unit: manifestation
    severity: major
    detect: { aura_id: 1285911 }
    tip: { pt: "Olhar para o seu fantasma para ele parar; não mover fantasma. No Mythic, dois fantasmas se encostando matam os dois alvos.", en: "Look at your ghost so it stops; don't move the ghost. On Mythic, two ghosts touching kill both targets." }
    message: { pt: "Manifestation of Dread", en: "Manifestation of Dread" }
    notes: "Fantasma que alcança o alvo aplica Dreadmarch. Colisão de fantasmas no Mythic: regra dread_collision."

  # Dois fantasmas que se encostam: Malevolent Resonance nos dois alvos (quase sempre mata os
  # dois). O fantasma só anda com o alvo de costas para ele.
  - key: dread_collision
    name: "Malevolent Resonance (ghosts touching)"
    type: failure_event
    source_unit: manifestation
    difficulty: [mythic]
    severity: wipe   # quase sempre mata os dois alvos
    detect:
      fail_ids: [1312132]         # Malevolent Resonance (dano nos alvos)
      confirm_aura: 1310744       # só o hit que aplica o debuff; o do fim dele (1s depois) não
      gaze:
        fixate_aura: 1285911      # Unnerving Fixation: fantasma -> alvo
        fixate_cast: 1285911      # o cast mostra onde o fantasma começa a perseguir
        hit_aura: 1310744         # Malevolent Resonance: os alvos dos dois fantasmas
        half_angle: 45
        window_ms: 5000
        # caminho de cada fantasma no replay: recalibrado em 14 e 15/10 (19 pulls Mythic, 385 fantasmas)
        # contra alcances, colisões e fantasmas limpos pelo Soul Sever (scripts/ghost-calibrate.mjs)
        sim: { name: "Manifestation of Dread", speed: 4.5, half_angle: 30, delay_ms: 2000, stun_ms: 500, catch_aura: 1297445, clear_auras: [1307959, 1307403] }
    tip: { pt: "Olhar para o próprio fantasma o tempo todo; de costas ele anda e, se encostar em outro, mata os dois alvos.", en: "Keep looking at your own ghost; with your back turned it walks, and if it touches another one it kills both targets." }
    message: { pt: "{count} colisão(ões) de fantasmas (Malevolent Resonance)", en: "{count} ghost collision(s) (Malevolent Resonance)" }
    notes: >
      O log só mostra onde o fantasma começa a perseguir (cast de Unnerving Fixation) e de quem
      ele é (a aura). Olhando, ele fica parado ali; de costas, ele vem em linha reta até o player,
      então a direção até o ponto de início serve para saber se o player olhava. Culpado = alvo
      de costas (fora de 45°) em pelo menos metade dos 5s antes da colisão. Calibrado em 9
      colisões de 13/10: em 6 um dos dois (ou os dois) estava de costas quase o tempo todo.
      Também culpado (28/10): o fantasma que andou pelo menos 3 jd e um quarto do caminho na
      simulação (sim), quando os dois simulados terminam a até 8 jd na colisão; de 15 colisões
      em 21, 22 e 26/10, o culpado passou de 2 para 14 (docs/coiled-altar-replay-audit.md).
      Os dois andaram: culpado é só o que andou por último (o outro já estava parado; até 1s de
      diferença, os dois).
      Debuff em um só player = os dois fantasmas eram dele, ou o outro alvo morreu/estava imune.

