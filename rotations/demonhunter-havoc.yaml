# Havoc Demon Hunter — rotação base (Midnight Season 2, patch 12.1).
# Escrita a partir do guia de rotação do Wowhead e da APL do SimulationCraft (branch midnight).
# Os textos são nossos; cooldowns e custos vêm dos tooltips do Wowhead.
# Validada no log de 29/09 (Dhknul e Keterz — Fel-Scarred).
spec: 577
name: Havoc Demon Hunter
patch: "12.1"
sources:
  - title: Wowhead — Havoc Demon Hunter Rotation Guide (Midnight)
    url: https://www.wowhead.com/guide/classes/demon-hunter/havoc/rotation-cooldowns-pve-dps
  - title: SimulationCraft — APL demonhunter_havoc (midnight)
    url: https://github.com/simulationcraft/simc/blob/midnight/ActionPriorityLists/default/demonhunter_havoc.simc

# Shattered Souls (pegar alma), o pulso do Consuming Fire e o segundo evento da The Hunt não são botões
ignore_casts: [228537, 456640, 370966]

key_points:
  - { pt: "Cooldowns curtos no cooldown: Eye Beam, Blade Dance / Death Sweep, Essence Break e Immolation Aura. Estourar Fury de vez em quando não é problema se a prioridade está certa.", en: "Short cooldowns on cooldown: Eye Beam, Blade Dance / Death Sweep, Essence Break and Immolation Aura. Capping Fury now and then is fine if the priority is right." }
  - { pt: "Gaste Fury com Chaos Strike / Annihilation, mas guarde o suficiente para o Blade Dance quando ele voltar.", en: "Spend Fury with Chaos Strike / Annihilation, but keep enough for Blade Dance when it comes back." }
  - { pt: "Metamorphosis reseta o Eye Beam e o Blade Dance (Chaotic Transformation): use os dois antes de entrar na Meta.", en: "Metamorphosis resets Eye Beam and Blade Dance (Chaotic Transformation): use both before entering Meta." }
  - { pt: "Vengeful Retreat logo antes do Eye Beam (Initiative / Inertia); se dessincronizar, Eye Beam no cooldown e segure o Retreat para o próximo.", en: "Vengeful Retreat right before Eye Beam (Initiative / Inertia); if they desync, Eye Beam on cooldown and hold Retreat for the next one." }
  - { pt: "Fel-Scarred: gaste os Demonsurge (Death Sweep / Annihilation) antes de outro Eye Beam ou Meta, senão eles se perdem; nunca fique parado com 2 cargas de Immolation Aura.", en: "Fel-Scarred: spend the Demonsurges (Death Sweep / Annihilation) before another Eye Beam or Meta, or they're lost; never sit on 2 Immolation Aura charges." }
  - { pt: "Aldrachi Reaver: use o Reaver's Glaive antes da próxima The Hunt (ela gera outro).", en: "Aldrachi Reaver: use Reaver's Glaive before the next The Hunt (it generates another)." }

hero_trees:
  - key: fel_scarred
    name: Fel-Scarred
    markers: [452416, 452487] # buff Demonsurge, Consuming Fire
  - key: aldrachi_reaver
    name: Aldrachi Reaver
    markers: [442294] # Reaver's Glaive

abilities:
  metamorphosis: { id: 200166, alt_ids: [191427], name: Metamorphosis, cooldown_ms: 120000 }
  the_hunt: { id: 370965, name: The Hunt, cast_ms: 1000, cooldown_ms: 90000 }
  # Abyssal Gaze é o Eye Beam dentro da Meta (Fel-Scarred)
  eye_beam: { id: 198013, alt_ids: [452497], name: Eye Beam, channel_ms: 2000, cooldown_ms: 30000 }
  essence_break: { id: 258860, name: Essence Break, cooldown_ms: 40000 }
  # Death Sweep é o Blade Dance dentro da Meta
  blade_dance: { id: 188499, alt_ids: [210152], name: Blade Dance, cooldown_ms: 15000 }
  # Consuming Fire é a Immolation Aura dentro da Meta (Fel-Scarred)
  immolation_aura: { id: 258920, alt_ids: [427917, 452487], name: Immolation Aura, cooldown_ms: 30000 }
  vengeful_retreat: { id: 198793, name: Vengeful Retreat }
  reavers_glaive: { id: 442294, name: "Reaver's Glaive", tree: aldrachi_reaver }
  chaos_strike: { id: 162794, alt_ids: [201427], name: Chaos Strike }
  felblade: { id: 232893, name: Felblade }
  throw_glaive: { id: 185123, name: Throw Glaive }
  fel_rush: { id: 195072, name: Fel Rush }

buffs:
  empowered_eye_beam: { id: 1271144, name: Empowered Eye Beam }
  initiative: { id: 391215, name: Initiative }
  exergy: { id: 208628, name: Exergy }

priority:
  fel_scarred:
    st:
      - { spell: immolation_aura, note: { pt: "gaste as cargas antes da Meta", en: "spend the charges before Meta" } }
      - { spell: metamorphosis, note: { pt: "depois de usar Eye Beam e Blade Dance (a Meta reseta os dois)", en: "after using Eye Beam and Blade Dance (Meta resets both)" } }
      - { spell: the_hunt, note: { pt: "com o Eye Beam a menos de 10s", en: "with Eye Beam less than 10s away" } }
      - { spell: vengeful_retreat, note: { pt: "1 GCD antes do Eye Beam", en: "1 GCD before Eye Beam" } }
      - { spell: immolation_aura, note: { pt: "se estiver com as cargas cheias", en: "if the charges are full" } }
      - { spell: blade_dance, note: { pt: "Death Sweep com Demonsurge disponível", en: "Death Sweep with Demonsurge available" } }
      - { spell: chaos_strike, note: { pt: "Annihilation com Demonsurge disponível", en: "Annihilation with Demonsurge available" } }
      - { spell: eye_beam, note: { pt: "no cooldown", en: "on cooldown" } }
      - { spell: essence_break, note: { pt: "no cooldown (segure se o Eye Beam volta em até 4s)", en: "on cooldown (hold it if Eye Beam is back within 4s)" } }
      - { spell: blade_dance, note: { pt: "Death Sweep / Blade Dance", en: "Death Sweep / Blade Dance" } }
      - { spell: chaos_strike, note: { pt: "Annihilation", en: "Annihilation" } }
      - { spell: felblade, note: { pt: "com 100 de Fury ou menos", en: "with 100 Fury or less" } }
      - { spell: chaos_strike }
      - { spell: immolation_aura }
      - { spell: throw_glaive, note: { pt: "ou Fel Rush, sem mais nada disponível", en: "or Fel Rush, with nothing else available" } }
    aoe:
      - { spell: immolation_aura, note: { pt: "nunca parado com 2 cargas; perto dos inimigos até o fim (Ragefire)", en: "never sit on 2 charges; near the enemies until the end (Ragefire)" } }
      - { spell: metamorphosis, note: { pt: "depois de usar Eye Beam e Blade Dance", en: "after using Eye Beam and Blade Dance" } }
      - { spell: the_hunt, note: { pt: "com o Eye Beam a menos de 10s", en: "with Eye Beam less than 10s away" } }
      - { spell: vengeful_retreat, note: { pt: "1 GCD antes do Eye Beam", en: "1 GCD before Eye Beam" } }
      - { spell: blade_dance, note: { pt: "Death Sweep com Demonsurge", en: "Death Sweep with Demonsurge" } }
      - { spell: eye_beam }
      - { spell: essence_break }
      - { spell: blade_dance }
      - { spell: chaos_strike }
      - { spell: felblade, note: { pt: "com 100 de Fury ou menos", en: "with 100 Fury or less" } }
  aldrachi_reaver:
    st:
      - { spell: the_hunt, note: { pt: "sem Reaver's Glaive na mão", en: "without Reaver's Glaive in hand" } }
      - { spell: metamorphosis }
      - { spell: vengeful_retreat, note: { pt: "1 GCD antes do Eye Beam", en: "1 GCD before Eye Beam" } }
      - { spell: reavers_glaive }
      - { spell: chaos_strike, note: { pt: "Annihilation com Rending Strike, depois do Glaive Flurry", en: "Annihilation with Rending Strike, after Glaive Flurry" } }
      - { spell: immolation_aura, note: { pt: "se estiver com as cargas cheias", en: "if the charges are full" } }
      - { spell: eye_beam }
      - { spell: essence_break }
      - { spell: blade_dance, note: { pt: "Death Sweep / Blade Dance", en: "Death Sweep / Blade Dance" } }
      - { spell: chaos_strike }
      - { spell: felblade }
      - { spell: immolation_aura }
      - { spell: fel_rush, note: { pt: "sem mais nada disponível", en: "with nothing else available" } }
    aoe:
      - { spell: the_hunt, note: { pt: "sem Reaver's Glaive na mão", en: "without Reaver's Glaive in hand" } }
      - { spell: metamorphosis }
      - { spell: reavers_glaive, note: { pt: "segure para empoderar o Blade Dance quando vierem adds", en: "hold it to empower Blade Dance when adds come" } }
      - { spell: chaos_strike, note: { pt: "empoderamentos: Chaos Strike antes do Blade Dance em 2+ alvos", en: "empowers: Chaos Strike before Blade Dance on 2+ targets" } }
      - { spell: eye_beam }
      - { spell: essence_break }
      - { spell: blade_dance }
      - { spell: immolation_aura }
      - { spell: felblade }

# Abertura: todos os cooldowns logo de cara (Immolation Aura pré-pull)
opener:
  window_ms: 15000
  ordered: false
  fel_scarred: [eye_beam, the_hunt, essence_break, metamorphosis]
  aldrachi_reaver: [the_hunt, reavers_glaive, eye_beam, metamorphosis]

checks:
  - kind: downtime
    id: always_be_casting
    gcd_ms: 1200
    min_gap_ms: 800
    importance: high
    title: { pt: "Tempo sem atacar", en: "Time not attacking" }
    tip: { pt: "Sempre com um GCD rodando: Felblade e Fel Rush para voltar ao alvo; Throw Glaive quando não der para chegar.", en: "Always have a GCD rolling: Felblade and Fel Rush to get back to the target; Throw Glaive when you can't reach it." }
  - kind: proc
    id: empowered_eye_beam
    buff: empowered_eye_beam
    spenders: [eye_beam]
    # o buff só sai no fim do canal do Eye Beam
    channel: { spell: eye_beam, ms: 2500 }
    importance: medium
    title: { pt: "Empowered Eye Beam perdido", en: "Empowered Eye Beam lost" }
    tip: { pt: "A The Hunt dobra o próximo Eye Beam: use a Hunt com o Eye Beam a menos de 10s.", en: "The Hunt doubles the next Eye Beam: use The Hunt with Eye Beam less than 10s away." }
  # tirado pelos tops (36 lutas): "Eye Beam sem Vengeful Retreat" — mesmo com Exergy, os tops só
  # combinam os dois em 40% dos Eye Beams (o quarto de baixo, 21%)
  - kind: cooldown
    id: cooldowns
    # Immolation Aura fora: um quarto dos tops usa 62% ou menos (36 lutas)
    spells: [metamorphosis, the_hunt, eye_beam, essence_break, blade_dance]
    min_usage: 0.8
    importance: medium
    title: { pt: "Cooldown parado", en: "Cooldown sitting" }
    tip: { pt: "Eye Beam, Blade Dance e Essence Break no cooldown; The Hunt e Meta sem segurar.", en: "Eye Beam, Blade Dance and Essence Break on cooldown; The Hunt and Meta without holding." }
