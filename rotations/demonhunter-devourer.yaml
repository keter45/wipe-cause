# Devourer Demon Hunter — rotação base (Midnight Season 2, patch 12.1).
# Escrita a partir do guia de rotação do Wowhead e da APL do SimulationCraft (branch midnight).
# Os textos são nossos; cooldowns e custos vêm dos tooltips do Wowhead.
# Validada no log de 29/09 (Markíno — Void-Scarred).
#
# Sem checagem de Fury estourada nem de Void Metamorphosis no cooldown: a Meta não tem cooldown
# (abre com 50 Soul Fragments) e a Fury dentro dela drena sozinha. Moment of Craving também não: em
# AoE o Void-Scarred deixa de usar Reap de propósito (as almas vão para o Eradicate).
spec: 1480
name: Devourer Demon Hunter
patch: "12.1"
sources:
  - title: Wowhead — Devourer Demon Hunter Rotation Guide (Midnight)
    url: https://www.wowhead.com/guide/classes/demon-hunter/devourer/rotation-cooldowns-pve-dps
  - title: SimulationCraft — APL demonhunter_devourer (midnight)
    url: https://github.com/simulationcraft/simc/blob/midnight/ActionPriorityLists/default/demonhunter_devourer.simc

# Soul Fragment (pegar alma) e o segundo evento da The Hunt não são botões
ignore_casts: [1223412, 1246169]

key_points:
  - { pt: "Entre na Void Metamorphosis e use o Void Ray assim que estiverem disponíveis: o dano vem das janelas de Meta.", en: "Enter Void Metamorphosis and use Void Ray as soon as they're available: the damage comes from the Meta windows." }
  - { pt: "Reap sempre que for coletar 4+ Soul Fragments (10 para o Eradicate), por causa do 4 peças.", en: "Reap whenever it will collect 4+ Soul Fragments (10 for Eradicate), because of the 4-piece." }
  - { pt: "Consume com Soulburst primeiro; Moment of Craving vai no próximo Reap / Cull.", en: "Consume with Soulburst first; Moment of Craving goes on the next Reap / Cull." }
  - { pt: "Void-Scarred: use todos os golpes corpo a corpo (Voidblade, Hungering Slash, The Hunt) e passe pela Meta o mais rápido possível; Annihilator estende a Meta para soltar o máximo de Collapsing Star.", en: "Void-Scarred: use every melee strike (Voidblade, Hungering Slash, The Hunt) and get through Meta as fast as possible; Annihilator extends Meta to fire as many Collapsing Stars as possible." }
  - { pt: "Leve procs e almas de um lado para o outro da Meta (smuggling): Hungering Slash vira Reaper's Toll dentro dela.", en: "Carry procs and souls from one side of Meta to the other (smuggling): Hungering Slash becomes Reaper's Toll inside it." }
  - { pt: "Soul Immolation no cooldown fora da Meta (ou com pouca Fury dentro dela).", en: "Soul Immolation on cooldown outside Meta (or with little Fury inside it)." }

hero_trees:
  - key: void_scarred
    name: Void-Scarred
    markers: [1245483, 1259431, 1245470] # Pierce the Veil, Predator's Wake, Reaper's Toll
  - key: annihilator
    name: Annihilator
    markers: [] # quem não usa os golpes do Void-Scarred

abilities:
  the_hunt: { id: 1246167, alt_ids: [1259431], name: The Hunt, cast_ms: 1000, cooldown_ms: 90000, tree: void_scarred } # os tops Annihilator não pegam a The Hunt
  soul_immolation: { id: 1241937, name: Soul Immolation, cooldown_ms: 60000 }
  voidblade: { id: 1245412, alt_ids: [1245414, 1245483], name: Voidblade, cooldown_ms: 30000, tree: void_scarred }
  reap: { id: 1226019, alt_ids: [1245453], name: Reap }
  void_ray: { id: 473728, name: Void Ray, channel_ms: 3000 }
  consume: { id: 473662, alt_ids: [1217610], name: Consume, cast_ms: 1500 }
  collapsing_star: { id: 1221150, name: Collapsing Star, cast_ms: 1500 }
  hungering_slash: { id: 1245470, name: "Reaper's Toll" }
  vengeful_retreat: { id: 198793, name: Vengeful Retreat }

buffs:
  soulburst: { id: 1297433, name: Soulburst }

priority:
  void_scarred:
    st:
      - { spell: consume, note: { pt: "fora da Meta: se for disparar o Soulburst", en: "outside Meta: if it will trigger Soulburst" } }
      - { spell: reap, note: { pt: "com 4+ Soul Fragments", en: "with 4+ Soul Fragments" } }
      - { spell: soul_immolation, note: { pt: "se não houver uma ativa", en: "if none is active" } }
      - { spell: voidblade, note: { pt: "logo antes de entrar na Meta", en: "right before entering Meta" } }
      - { spell: the_hunt, note: { pt: "no cooldown (Meta durante a viagem da Hunt)", en: "on cooldown (Meta while The Hunt is travelling)" } }
      - { spell: hungering_slash, note: { pt: "Hungering Slash / Reaper's Toll", en: "Hungering Slash / Reaper's Toll" } }
      - { spell: vengeful_retreat, note: { pt: "com Voidstep", en: "with Voidstep" } }
      - { spell: void_ray }
      - { spell: consume, note: { pt: "preenche (Devour na Meta)", en: "filler (Devour in Meta)" } }
    aoe:
      - { spell: reap, note: { pt: "Eradicate com 10 Soul Fragments", en: "Eradicate with 10 Soul Fragments" } }
      - { spell: void_ray }
      - { spell: consume, note: { pt: "Devour se for disparar o Soulburst", en: "Devour if it will trigger Soulburst" } }
      - { spell: hungering_slash, note: { pt: "Reaper's Toll", en: "Reaper's Toll" } }
      - { spell: voidblade, note: { pt: "Pierce the Veil", en: "Pierce the Veil" } }
      - { spell: the_hunt, note: { pt: "Predator's Wake", en: "Predator's Wake" } }
      - { spell: soul_immolation, note: { pt: "com 20 de Fury ou menos, saindo da Meta", en: "with 20 Fury or less, leaving Meta" } }
      - { spell: consume }
  annihilator:
    st:
      - { spell: consume, note: { pt: "se for disparar o Soulburst", en: "if it will trigger Soulburst" } }
      - { spell: reap, note: { pt: "com 4+ Soul Fragments", en: "with 4+ Soul Fragments" } }
      - { spell: void_ray }
      - { spell: soul_immolation }
      - { spell: collapsing_star, note: { pt: "na Meta, com 30 Soul Fragments", en: "in Meta, with 30 Soul Fragments" } }
      - { spell: consume, note: { pt: "preenche (Devour na Meta)", en: "filler (Devour in Meta)" } }
    aoe:
      - { spell: void_ray, note: { pt: "sem Eradicate", en: "without Eradicate" } }
      - { spell: collapsing_star }
      - { spell: reap, note: { pt: "só se der Voidfall ou almas para o Collapsing Star", en: "only if it gives Voidfall or souls for Collapsing Star" } }
      - { spell: soul_immolation }
      - { spell: consume }

# Abertura: Soul Immolation e Consume pré-pull, depois Reap / Void Ray até a Meta
# Pelos tops (36 lutas): Void-Scarred com Reap, Void Ray, Voidblade e The Hunt em até 15s (85%);
# Annihilator com Consume, Void Ray e Soul Immolation (87%); o Reap falta em 43% deles
opener:
  window_ms: 15000
  ordered: false
  void_scarred: [reap, void_ray, voidblade, the_hunt]
  annihilator: [consume, void_ray, soul_immolation]

checks:
  - kind: downtime
    id: always_be_casting
    gcd_ms: 1200
    min_gap_ms: 800
    importance: high
    title: { pt: "Tempo sem castar", en: "Time not casting" }
    tip: { pt: "Sempre castando: Reap e os golpes corpo a corpo são instantâneos para o movimento.", en: "Always casting: Reap and the melee strikes are instant for movement." }
  - kind: proc
    id: soulburst
    buff: soulburst
    spenders: [consume]
    importance: medium
    title: { pt: "Soulburst perdido", en: "Soulburst lost" }
    tip: { pt: "Soulburst deixa o próximo Consume / Devour instantâneo e explodindo: use antes de acabar.", en: "Soulburst makes the next Consume / Devour instant and exploding: use it before it expires." }
  - kind: cooldown
    id: cooldowns
    spells: [the_hunt, soul_immolation, voidblade]
    min_usage: 0.85
    importance: medium
    title: { pt: "Cooldown parado", en: "Cooldown sitting" }
    tip: { pt: "The Hunt, Soul Immolation e Voidblade no cooldown.", en: "The Hunt, Soul Immolation and Voidblade on cooldown." }
