[package]
name = "wipe-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Parser do WoWCombatLog.txt e análise de pulls"

[dependencies]
serde.workspace = true
serde_json.workspace = true
yaml_serde = "0.10"

# no navegador o std não tem relógio
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1.1"

[[bin]]
name = "wipe-cli"
path = "src/bin/wipe-cli.rs"
