# Assassination Rogue — rotação base (Midnight Season 2, patch 12.1).
# Escrita a partir do guia de rotação do Wowhead e da APL do SimulationCraft (branch midnight).
# Os textos são nossos; cooldowns e custos vêm dos tooltips do Wowhead.
# Validada no log de 29/09 (Phënomz e Thigazr — Fatebound).
#
# Sem checagem de tempo parado: o Assassination é travado por energia, não por GCD, e o tempo
# sem apertar botão faz parte da rotação (guardar energia para o Envenom).
spec: 259
name: Assassination Rogue
patch: "12.1"
sources:
  - title: Wowhead — Assassination Rogue Rotation Guide (Midnight)
    url: https://www.wowhead.com/guide/classes/rogue/assassination/rotation-cooldowns-pve-dps
  - title: SimulationCraft — APL rogue_assassination (midnight)
    url: https://github.com/simulationcraft/simc/blob/midnight/ActionPriorityLists/default/rogue_assassination.simc

key_points:
  - { pt: "Garrote e Rupture sempre no alvo (Rupture com 5+ combo points); em AoE, Crimson Tempest espalha os dois.", en: "Garrote and Rupture always on the target (Rupture at 5+ combo points); in AoE, Crimson Tempest spreads both." }
  - { pt: "Gere com Mutilate (Fan of Knives com 2+ alvos) até 5+ combo points e gaste com Envenom sem estourar combo points.", en: "Build with Mutilate (Fan of Knives on 2+ targets) up to 5+ combo points and spend with Envenom without capping combo points." }
  - { pt: "Deathmark no cooldown, com Garrote e Rupture rodando; Kingsbane logo depois (e a cada 1 min).", en: "Deathmark on cooldown, with Garrote and Rupture rolling; Kingsbane right after (and every 1 min)." }
  - { pt: "Vanish junto do Deathmark, seguido de Garrote (Improved Garrote); renove o Garrote no fim dos 6s do Improved Garrote.", en: "Vanish together with Deathmark, followed by Garrote (Improved Garrote); refresh Garrote at the end of Improved Garrote's 6s." }
  - { pt: "É uma spec de energia: encadeie o Envenom no último 1–2s do buff (Rapid Injection); nos cooldowns, gaste tudo.", en: "It's an energy spec: chain Envenom in the last 1–2s of the buff (Rapid Injection); during cooldowns, spend everything." }
  - { pt: "Deathstalker: Shiv no cooldown em alvo único e Envenom com o máximo de combo points no Darkest Night.", en: "Deathstalker: Shiv on cooldown on single target and Envenom with max combo points in Darkest Night." }

hero_trees:
  - key: fatebound
    name: Fatebound
    markers: [452923, 452917] # buffs Fatebound Coin (Heads / Tails)
  - key: deathstalker
    name: Deathstalker
    markers: [] # quem não joga as moedas do Fatebound

abilities:
  deathmark: { id: 360194, name: Deathmark, cooldown_ms: 120000 }
  kingsbane: { id: 385627, name: Kingsbane, cooldown_ms: 60000 }
  vanish: { id: 1856, name: Vanish, cooldown_ms: 120000 }
  shiv: { id: 5938, name: Shiv }
  garrote: { id: 703, name: Garrote }
  rupture: { id: 1943, name: Rupture }
  mutilate: { id: 1329, name: Mutilate }
  envenom: { id: 32645, name: Envenom }
  fan_of_knives: { id: 51723, name: Fan of Knives }
  crimson_tempest: { id: 1247227, name: Crimson Tempest }

buffs:
  garrote: { id: 703, name: Garrote }
  rupture: { id: 1943, name: Rupture }
  improved_garrote: { id: 392401, name: Improved Garrote }

priority:
  fatebound:
    st:
      - { spell: garrote, note: { pt: "manter no alvo", en: "keep it on the target" } }
      - { spell: mutilate, note: { pt: "até 5+ combo points", en: "up to 5+ combo points" } }
      - { spell: rupture, note: { pt: "manter, com 5+ combo points", en: "keep it up, at 5+ combo points" } }
      - { spell: vanish, note: { pt: "seguido de Garrote (Improved Garrote), junto do Deathmark", en: "followed by Garrote (Improved Garrote), together with Deathmark" } }
      - { spell: deathmark, note: { pt: "no cooldown", en: "on cooldown" } }
      - { spell: kingsbane, note: { pt: "no cooldown, logo depois do Deathmark quando der", en: "on cooldown, right after Deathmark when possible" } }
      - { spell: envenom, note: { pt: "com 5+ combo points, no fim do buff do Envenom", en: "at 5+ combo points, at the end of the Envenom buff" } }
    aoe:
      - { spell: garrote, note: { pt: "manter no alvo principal", en: "keep it on the main target" } }
      - { spell: rupture, note: { pt: "manter no alvo principal, com 5+ combo points", en: "keep it on the main target, at 5+ combo points" } }
      - { spell: crimson_tempest, note: { pt: "espalha os sangramentos, até 5+ combo points", en: "spreads the bleeds, up to 5+ combo points" } }
      - { spell: fan_of_knives, note: { pt: "2+ alvos, até 5+ combo points", en: "2+ targets, up to 5+ combo points" } }
      - { spell: vanish, note: { pt: "seguido de Garrote; junto do Deathmark", en: "followed by Garrote; together with Deathmark" } }
      - { spell: deathmark, note: { pt: "no cooldown", en: "on cooldown" } }
      - { spell: kingsbane, note: { pt: "logo depois do Deathmark", en: "right after Deathmark" } }
      - { spell: envenom, note: { pt: "com 5+ combo points", en: "at 5+ combo points" } }
  deathstalker:
    st:
      - { spell: garrote, note: { pt: "manter no alvo", en: "keep it on the target" } }
      - { spell: shiv, note: { pt: "no cooldown (com Toxic Stiletto), nunca com adds", en: "on cooldown (with Toxic Stiletto), never with adds" } }
      - { spell: mutilate, note: { pt: "até 5+ combo points", en: "up to 5+ combo points" } }
      - { spell: envenom, note: { pt: "com o máximo de combo points no Darkest Night", en: "with max combo points in Darkest Night" } }
      - { spell: rupture, note: { pt: "manter, com 5+ combo points (não no Darkest Night, fora da abertura)", en: "keep it up, at 5+ combo points (not in Darkest Night, outside the opener)" } }
      - { spell: vanish, note: { pt: "seguido de Garrote, junto do Deathmark", en: "followed by Garrote, together with Deathmark" } }
      - { spell: deathmark, note: { pt: "no cooldown", en: "on cooldown" } }
      - { spell: kingsbane, note: { pt: "logo depois do Deathmark", en: "right after Deathmark" } }
      - { spell: envenom, note: { pt: "com 5+ combo points", en: "at 5+ combo points" } }
    aoe:
      - { spell: garrote, note: { pt: "manter no alvo principal", en: "keep it on the main target" } }
      - { spell: rupture, note: { pt: "manter no alvo principal", en: "keep it on the main target" } }
      - { spell: crimson_tempest, note: { pt: "espalha os sangramentos", en: "spreads the bleeds" } }
      - { spell: fan_of_knives, note: { pt: "2+ alvos", en: "2+ targets" } }
      - { spell: vanish, note: { pt: "seguido de Garrote", en: "followed by Garrote" } }
      - { spell: deathmark }
      - { spell: kingsbane }
      - { spell: envenom, note: { pt: "com o máximo de combo points no Darkest Night", en: "with max combo points in Darkest Night" } }

# Abertura: Garrote, Rupture e depois Deathmark e Kingsbane
opener:
  window_ms: 15000
  fatebound: [garrote, rupture, deathmark, kingsbane]
  deathstalker: [garrote, rupture, deathmark, kingsbane]

checks:
  - kind: resource_waste
    id: combo_points
    power_type: 4
    resource: combo points
    importance: medium
    title: { pt: "Combo points desperdiçados", en: "Combo points wasted" }
    tip: { pt: "Finalize com 5+ combo points antes de gerar mais (o Seal Fate dá extras nos críticos).", en: "Finish at 5+ combo points before building more (Seal Fate gives extras on crits)." }
  - kind: dot_uptime
    id: garrote
    debuff: garrote
    min_uptime: 0.9
    importance: high
    title: { pt: "Garrote fora do alvo", en: "Garrote off the target" }
    tip: { pt: "Garrote sempre no alvo: renove no pandemic.", en: "Garrote always on the target: refresh in pandemic." }
  - kind: dot_uptime
    id: rupture
    debuff: rupture
    min_uptime: 0.9
    importance: high
    title: { pt: "Rupture fora do alvo", en: "Rupture off the target" }
    tip: { pt: "Rupture sempre no alvo, renovando com 5+ combo points no pandemic.", en: "Rupture always on the target, refreshing at 5+ combo points in pandemic." }
  - kind: after_cast
    id: vanish_garrote
    casts: [vanish]
    after: [garrote]
    within_ms: 3000
    followed_by: true
    importance: medium
    title: { pt: "Vanish sem Garrote", en: "Vanish without Garrote" }
    tip: { pt: "O Vanish serve para o Improved Garrote: Garrote logo em seguida.", en: "Vanish is for Improved Garrote: Garrote right after." }
  - kind: cooldown
    id: cooldowns
    spells: [deathmark, kingsbane, vanish]
    min_usage: 0.8
    importance: medium
    title: { pt: "Cooldown parado", en: "Cooldown sitting" }
    tip: { pt: "Deathmark e Kingsbane no cooldown, com o Vanish junto do Deathmark.", en: "Deathmark and Kingsbane on cooldown, with Vanish together with Deathmark." }
