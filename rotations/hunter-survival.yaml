# Survival Hunter — rotação base GERADA por scripts/rotation.mjs (revise os textos antes de publicar).
# Prioridade e checagens a partir da APL e dos dados de spell do SimulationCraft (branch midnight);
# ids pelos casts de 34 pulls nos logs; metas calibradas em 34 pulls dos tops.
#
# Removido na calibração:
#   - Aspect of the Eagle da checagem de cooldown (os tops usam 27% dos possíveis)
#   - Tip of the Spear perdido (os tops "perdem" 29%: o buff é gasto por outra coisa ou de propósito)
spec: 255
name: "Survival Hunter"
patch: "12.1"
sources:
  - title: "SimulationCraft — APL hunter_survival (midnight)"
    url: https://github.com/simulationcraft/simc/blob/midnight/ActionPriorityLists/default/hunter_survival.simc
  - title: "Wowhead — Survival Hunter Rotation Guide"
    url: https://www.wowhead.com/guide/classes/hunter/survival/rotation-cooldowns-pve-dps

# casts no log que não são o player apertando um botão
ignore_casts: [1253859]

key_points:
  - { pt: "Cooldowns no cooldown: Boomstick, Takedown.", en: "Cooldowns on cooldown: Boomstick, Takedown." }
  - { pt: "Não estoure Focus.", en: "Don't cap Focus." }
  - { pt: "Sempre com um GCD rodando; no movimento, as habilidades instantâneas.", en: "Always have a GCD rolling; while moving, the instant abilities." }

hero_trees:
  - key: sentinel
    name: "Sentinel"
    markers: [1264949, 1253750]
  - key: pack_leader
    name: "Pack Leader"
    markers: [472640, 471877]

abilities:
  aspect_of_the_eagle: { id: 186289, name: "Aspect of the Eagle", cooldown_ms: 90000 }
  takedown: { id: 1250646, name: "Takedown", cooldown_ms: 90000 }
  boomstick: { id: 1261193, name: "Boomstick", channel_ms: 3000, cooldown_ms: 60000 }
  wildfire_bomb: { id: 259495, name: "Wildfire Bomb", cooldown_ms: 18000 }
  kill_command: { id: 259489, name: "Kill Command", cooldown_ms: 5000, charges: 2 }
  moonlight_chakram: { id: 1264949, name: "Moonlight Chakram", tree: sentinel }
  raptor_strike: { id: 186270, alt_ids: [265189], name: "Raptor Strike" }

buffs:
  tip_of_the_spear: { id: 260286, name: "Tip of the Spear" }

priority:
  sentinel:
    st:
      - { spell: aspect_of_the_eagle }
      - { spell: kill_command, note: { pt: "com 0 Tip of the Spear", en: "with 0 Tip of the Spear" } }
      - { spell: boomstick }
      - { spell: wildfire_bomb, note: { pt: "perto de encher as cargas", en: "close to capping charges" } }
      - { spell: kill_command }
      - { spell: takedown }
      - { spell: moonlight_chakram }
      - { spell: raptor_strike }
      - { spell: wildfire_bomb }
    aoe:
      - { spell: aspect_of_the_eagle }
      - { spell: kill_command, note: { pt: "com 0 Tip of the Spear", en: "with 0 Tip of the Spear" } }
      - { spell: boomstick, note: { pt: "com Tip of the Spear", en: "with Tip of the Spear" } }
      - { spell: wildfire_bomb, note: { pt: "com Tip of the Spear", en: "with Tip of the Spear" } }
      - { spell: kill_command }
      - { spell: takedown }
      - { spell: moonlight_chakram, note: { pt: "com Tip of the Spear", en: "with Tip of the Spear" } }
      - { spell: raptor_strike }
  pack_leader:
    st:
      - { spell: aspect_of_the_eagle }
      - { spell: kill_command }
      - { spell: takedown }
      - { spell: wildfire_bomb, note: { pt: "com Tip of the Spear, perto de encher as cargas", en: "with Tip of the Spear, close to capping charges" } }
      - { spell: boomstick, note: { pt: "com Tip of the Spear", en: "with Tip of the Spear" } }
      - { spell: raptor_strike }
      - { spell: wildfire_bomb, note: { pt: "com Tip of the Spear", en: "with Tip of the Spear" } }
      - { spell: kill_command, note: { pt: "com 0 Tip of the Spear", en: "with 0 Tip of the Spear" } }
      - { spell: boomstick }
      - { spell: moonlight_chakram }
    aoe:
      - { spell: aspect_of_the_eagle }
      - { spell: kill_command }
      - { spell: takedown }
      - { spell: wildfire_bomb, note: { pt: "perto de encher as cargas", en: "close to capping charges" } }
      - { spell: boomstick, note: { pt: "com Tip of the Spear", en: "with Tip of the Spear" } }
      - { spell: wildfire_bomb, note: { pt: "com Tip of the Spear", en: "with Tip of the Spear" } }
      - { spell: raptor_strike }
      - { spell: kill_command, note: { pt: "com 0 Tip of the Spear", en: "with 0 Tip of the Spear" } }
      - { spell: moonlight_chakram, note: { pt: "com Tip of the Spear", en: "with Tip of the Spear" } }

opener:
  window_ms: 12000
  ordered: false
  sentinel: [wildfire_bomb, takedown, boomstick]
  pack_leader: [wildfire_bomb]

checks:
  - kind: downtime
    id: always_be_casting
    gcd_ms: 1200
    min_gap_ms: 800
    importance: high
    title: { pt: "Tempo sem castar", en: "Time not casting" }
    tip: { pt: "Sempre com um GCD rodando: no movimento, use as habilidades instantâneas.", en: "Always have a GCD rolling: while moving, use the instant abilities." }
  - kind: resource_waste
    id: focus
    power_type: 2
    resource: "Focus"
    importance: high
    title: { pt: "Focus desperdiçado", en: "Focus wasted" }
    tip: { pt: "Gaste com Boomstick / Wildfire Bomb antes de chegar ao máximo de Focus.", en: "Spend with Boomstick / Wildfire Bomb before reaching max Focus." }
    from: [kill_command, takedown]
  - kind: cooldown
    id: cooldowns
    spells: [boomstick, takedown]
    min_usage: 0.7
    importance: medium
    title: { pt: "Cooldown parado", en: "Cooldown sitting" }
    tip: { pt: "Aspect of the Eagle, Boomstick, Takedown no cooldown.", en: "Aspect of the Eagle, Boomstick, Takedown on cooldown." }
