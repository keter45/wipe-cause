  - key: gravebound
    name: "Gravebound"
    type: info
    source_unit: malacrass
    severity: major
    detect: { damage_ids: [1308330], aura_id: 1286837 }
    # 15/10: Gravebound entra com 3 stacks; cada fragmento pego é um acerto de 1308330 (com a posição de
    # quem pegou) e tira 1 stack. O log não põe os fragmentos no chão: no replay ficam onde foram pegos.
    pickup: { aura: 1286837, hit_ids: [1308330] }
    tip: { pt: "Quem recebe Gravebound pega os próprios fragmentos antes do debuff acabar, senão morre.", en: "Whoever gets Gravebound picks up their own fragments before the debuff ends, or dies." }
    message: { pt: "Gravebound", en: "Gravebound" }

  # O fim do Gravebound com fragmento sem pegar: um golpe de ~38-40 mi (1297906) em quem tinha o debuff,
  # no mesmo ms em que a aura sai. 14, 15, 19, 20, 21, 22 e 26/10 Mythic: 150 acertos, todos em quem tinha o
  # Gravebound na hora (11 a 16s depois de receber), com 1 a 5 fragmentos faltando; ninguém mais toma. O
  # SPELL_MISSED (imune) não conta.
  - key: gravebound_expired
    name: "Gravebound (fragments left)"
    type: avoidable_damage
    source_unit: malacrass
    severity: major
    detect: { damage_ids: [1297906] }
    ground: false
    tip: { pt: "Pegar todos os próprios fragmentos antes do Gravebound acabar: o fim dele com fragmento sobrando mata.", en: "Pick up all your own fragments before Gravebound ends: it ending with fragments left kills you." }
    message: { pt: "{player} deixou o Gravebound acabar com fragmentos sem pegar ({count}x)", en: "{player} let Gravebound end with fragments left ({count}x)" }

