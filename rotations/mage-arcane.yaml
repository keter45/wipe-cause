# Arcane Mage — rotação base (Midnight Season 2, patch 12.1).
# Escrita a partir do guia de rotação do Wowhead e da APL do SimulationCraft (branch midnight).
# Os textos são nossos; cooldowns e custos vêm dos tooltips do Wowhead.
# Validada no log de 29/09 (Spieli, Kurä e Vessinia — Sunfury).
spec: 62
name: Arcane Mage
patch: "12.1"
sources:
  - title: Wowhead — Arcane Mage Rotation Guide (Midnight)
    url: https://www.wowhead.com/guide/classes/mage/arcane/rotation-cooldowns-pve-dps
  - title: SimulationCraft — APL mage_arcane (midnight)
    url: https://github.com/simulationcraft/simc/blob/midnight/ActionPriorityLists/default/mage_arcane.simc

key_points:
  - { pt: "Arcane Barrage com 4 Arcane Charges: Arcane Blast, Arcane Orb, Touch of the Magi e Prismatic Bolt geram; o Barrage gasta todas.", en: "Arcane Barrage at 4 Arcane Charges: Arcane Blast, Arcane Orb, Touch of the Magi and Prismatic Bolt build them; Barrage spends them all." }
  - { pt: "Clearcasting vira Arcane Missiles (que dá Arcane Salvo); não deixe acumular nem expirar.", en: "Clearcasting turns into Arcane Missiles (which gives Arcane Salvo); don't let it stack up or expire." }
  - { pt: "Prismatic Bolt é o proc mais forte e não acumula: gaste logo (com 8 Cumulative Power, se tiver o 4 peças).", en: "Prismatic Bolt is the strongest proc and doesn't stack: spend it right away (at 8 Cumulative Power, with the 4-piece)." }
  - { pt: "Arcane Salvo alimenta o Arcane Barrage: Sunfury gasta com Clearcasting e 12+ (ou 25), Spellslinger com 20.", en: "Arcane Salvo fuels Arcane Barrage: Sunfury spends it with Clearcasting and 12+ (or 25), Spellslinger at 20." }
  - { pt: "Arcane Surge no cooldown, e Touch of the Magi com o Barrage (ou Prismatic Bolt) ainda no ar; no Sunfury, Barrage durante o Arcane Soul.", en: "Arcane Surge on cooldown, and Touch of the Magi with Barrage (or Prismatic Bolt) still in the air; for Sunfury, Barrage during Arcane Soul." }
  - { pt: "Mana não é problema nesta temporada: o que pesa é estar sempre castando (Shimmer e stutter step no movimento).", en: "Mana isn't a problem this season: what matters is always casting (Shimmer and stutter step while moving)." }

hero_trees:
  - key: sunfury
    name: Sunfury
    markers: [451038, 448604] # buffs Arcane Soul e Spellfire Sphere
  - key: spellslinger
    name: Spellslinger
    markers: [] # quem não ganha os buffs do Sunfury

abilities:
  arcane_surge: { id: 365350, name: Arcane Surge, cast_ms: 2500, cooldown_ms: 90000 }
  touch_of_the_magi: { id: 321507, name: Touch of the Magi, cooldown_ms: 45000 }
  arcane_orb: { id: 153626, name: Arcane Orb }
  arcane_missiles: { id: 5143, name: Arcane Missiles, channel_ms: 2500 }
  arcane_barrage: { id: 44425, name: Arcane Barrage }
  prismatic_bolt: { id: 1295924, name: Prismatic Bolt, cast_ms: 2500 }
  arcane_blast: { id: 30451, name: Arcane Blast, cast_ms: 2250 }
  arcane_explosion: { id: 1449, name: Arcane Explosion }

buffs:
  clearcasting: { id: 263725, name: Clearcasting }
  prismatic_bolt: { id: 1295942, name: "Prismatic Bolt!" }
  arcane_soul: { id: 451038, name: Arcane Soul }

priority:
  sunfury:
    st:
      - { spell: arcane_surge, note: { pt: "no cooldown", en: "on cooldown" } }
      - { spell: touch_of_the_magi, note: { pt: "com o Barrage/Prismatic Bolt no ar; junto do Surge ou a cada 45s", en: "with Barrage/Prismatic Bolt in the air; together with Surge or every 45s" } }
      - { spell: arcane_missiles, note: { pt: "com Clearcasting e menos de 12 Arcane Salvo", en: "with Clearcasting and fewer than 12 Arcane Salvo" } }
      - { spell: arcane_barrage, note: { pt: "durante o Arcane Soul", en: "during Arcane Soul" } }
      - { spell: prismatic_bolt, note: { pt: "de preferência com 8 Cumulative Power (4 peças)", en: "preferably at 8 Cumulative Power (4-piece)" } }
      - { spell: arcane_barrage, note: { pt: "com Clearcasting e 12+ Arcane Salvo, ou 25 Arcane Salvo (sempre com 4 Arcane Charges)", en: "with Clearcasting and 12+ Arcane Salvo, or 25 Arcane Salvo (always at 4 Arcane Charges)" } }
      - { spell: arcane_orb, note: { pt: "sem Arcane Charges", en: "without Arcane Charges" } }
      - { spell: arcane_blast, note: { pt: "gera Arcane Charge (preenche)", en: "generates Arcane Charge (filler)" } }
    aoe:
      - { spell: arcane_surge, note: { pt: "no cooldown", en: "on cooldown" } }
      - { spell: touch_of_the_magi, note: { pt: "no alvo mais resistente", en: "on the tankiest target" } }
      - { spell: arcane_missiles, note: { pt: "com Clearcasting e menos de 12 Arcane Salvo", en: "with Clearcasting and fewer than 12 Arcane Salvo" } }
      - { spell: arcane_barrage, note: { pt: "durante o Arcane Soul; com 12+ Arcane Salvo e Orb pronto em 5+ alvos", en: "during Arcane Soul; with 12+ Arcane Salvo and Orb ready on 5+ targets" } }
      - { spell: prismatic_bolt }
      - { spell: arcane_orb, note: { pt: "sem Arcane Charges", en: "without Arcane Charges" } }
      - { spell: arcane_blast }
  spellslinger:
    st:
      - { spell: arcane_surge, note: { pt: "no cooldown", en: "on cooldown" } }
      - { spell: touch_of_the_magi, note: { pt: "com o Barrage/Prismatic Bolt no ar", en: "with Barrage/Prismatic Bolt in the air" } }
      - { spell: prismatic_bolt, note: { pt: "com 13+ Arcane Salvo e (6+ Cumulative Power ou sem Clearcasting)", en: "with 13+ Arcane Salvo and (6+ Cumulative Power or no Clearcasting)" } }
      - { spell: arcane_barrage, note: { pt: "com 20 Arcane Salvo", en: "at 20 Arcane Salvo" } }
      - { spell: arcane_missiles, note: { pt: "com Clearcasting e menos de 15 Arcane Salvo", en: "with Clearcasting and fewer than 15 Arcane Salvo" } }
      - { spell: prismatic_bolt, note: { pt: "quando aparecer", en: "when it procs" } }
      - { spell: arcane_orb, note: { pt: "sem Arcane Charges", en: "without Arcane Charges" } }
      - { spell: arcane_blast, note: { pt: "gera Arcane Charge (preenche)", en: "generates Arcane Charge (filler)" } }
    aoe:
      - { spell: arcane_surge, note: { pt: "no cooldown", en: "on cooldown" } }
      - { spell: touch_of_the_magi }
      - { spell: prismatic_bolt, note: { pt: "2+ alvos", en: "2+ targets" } }
      - { spell: arcane_orb, note: { pt: "antes de encher as cargas (Orb Mastery)", en: "before the charges fill (Orb Mastery)" } }
      - { spell: arcane_barrage, note: { pt: "com 20 Arcane Salvo e 4 Arcane Charges", en: "at 20 Arcane Salvo and 4 Arcane Charges" } }
      - { spell: arcane_missiles, note: { pt: "com Clearcasting e menos de 15 Arcane Salvo", en: "with Clearcasting and fewer than 15 Arcane Salvo" } }
      - { spell: arcane_orb, note: { pt: "2+ alvos", en: "2+ targets" } }
      - { spell: arcane_blast }

# Abertura: Arcane Surge, um Missiles e um Barrage, e o Touch of the Magi com o Barrage no ar
opener:
  window_ms: 10000
  sunfury: [arcane_surge, arcane_missiles, arcane_barrage, touch_of_the_magi]
  spellslinger: [arcane_surge, arcane_missiles, arcane_barrage, touch_of_the_magi]

checks:
  - kind: downtime
    id: always_be_casting
    gcd_ms: 1200
    min_gap_ms: 800
    importance: high
    title: { pt: "Tempo sem castar", en: "Time not casting" }
    tip: { pt: "Sempre castando: Shimmer e stutter step no movimento; Missiles com Clearcasting e Barrage são bons para andar.", en: "Always casting: Shimmer and stutter step while moving; Missiles with Clearcasting and Barrage are good for moving." }
  - kind: proc
    id: clearcasting
    buff: clearcasting
    spenders: [arcane_missiles, arcane_explosion]
    importance: medium
    title: { pt: "Clearcasting perdido", en: "Clearcasting lost" }
    tip: { pt: "Clearcasting vira Arcane Missiles: gaste antes de acumular no máximo ou expirar.", en: "Clearcasting turns into Arcane Missiles: spend it before it caps or expires." }
  - kind: proc
    id: prismatic_bolt
    buff: prismatic_bolt
    spenders: [prismatic_bolt]
    importance: high
    title: { pt: "Prismatic Bolt perdido", en: "Prismatic Bolt lost" }
    tip: { pt: "Prismatic Bolt é o feitiço mais forte e não acumula: use antes de acabar.", en: "Prismatic Bolt is the strongest spell and doesn't stack: use it before it expires." }
  - kind: after_cast
    id: touch_after_barrage
    casts: [touch_of_the_magi]
    after: [arcane_barrage, prismatic_bolt]
    within_ms: 1500
    importance: low
    title: { pt: "Touch of the Magi fora do Barrage", en: "Touch of the Magi outside Barrage" }
    tip: { pt: "Solte o Touch of the Magi com o Arcane Barrage (ou Prismatic Bolt) ainda no ar: o dano dele entra no Touch.", en: "Cast Touch of the Magi with Arcane Barrage (or Prismatic Bolt) still in the air: its damage goes into the Touch." }
  - kind: cooldown
    id: cooldowns
    spells: [arcane_surge, touch_of_the_magi]
    min_usage: 0.8
    importance: medium
    title: { pt: "Cooldown parado", en: "Cooldown sitting" }
    tip: { pt: "Arcane Surge no cooldown; Touch of the Magi a cada 45s, sem segurar mais que alguns segundos.", en: "Arcane Surge on cooldown; Touch of the Magi every 45s, without holding it more than a few seconds." }
