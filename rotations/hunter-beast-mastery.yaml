# Beast Mastery Hunter — rotação base (Midnight Season 2, patch 12.1).
# Escrita a partir do guia de rotação do Wowhead e da APL do SimulationCraft (branch midnight).
# Os textos são nossos; cooldowns e custos vêm dos tooltips do Wowhead.
# Validada no log de 29/09 (Kuraa e Bettaozor — Pack Leader).
#
# Sem Cobra Fang: o buff acumula e é consumido por mais coisas do que o Cobra Shot, o log não separa.
spec: 253
name: Beast Mastery Hunter
patch: "12.1"
sources:
  - title: Wowhead — Beast Mastery Hunter Rotation Guide (Midnight)
    url: https://www.wowhead.com/guide/classes/hunter/beast-mastery/rotation-cooldowns-pve-dps
  - title: SimulationCraft — APL hunter_beast_mastery (midnight)
    url: https://github.com/simulationcraft/simc/blob/midnight/ActionPriorityLists/default/hunter_beast_mastery.simc

key_points:
  - { pt: "Bestial Wrath no cooldown, sempre: perder um uso perde muito dano.", en: "Bestial Wrath on cooldown, always: losing a use loses a lot of damage." }
  - { pt: "Kill Command nunca com 2 cargas, sempre com Nature's Ally, e o máximo deles dentro do Bestial Wrath.", en: "Kill Command never at 2 charges, always with Nature's Ally, and as many as possible inside Bestial Wrath." }
  - { pt: "Barbed Shot antes de chegar a 2 cargas e logo antes do Bestial Wrath.", en: "Barbed Shot before reaching 2 charges and right before Bestial Wrath." }
  - { pt: "Cobra Shot com Cobra Fang; no resto, preenche.", en: "Cobra Shot with Cobra Fang; otherwise, filler." }
  - { pt: "Pets no alvo certo (macros de ataque, Dash manual); em AoE, Wild Thrash para ativar o Beast Cleave antes do Bestial Wrath.", en: "Pets on the right target (attack macros, manual Dash); in AoE, Wild Thrash to activate Beast Cleave before Bestial Wrath." }
  - { pt: "Dark Ranger: Black Arrow no cooldown e o Wailing Arrow antes de acabar.", en: "Dark Ranger: Black Arrow on cooldown and Wailing Arrow before it expires." }

hero_trees:
  - key: pack_leader
    name: Pack Leader
    markers: [471877] # buff Howl of the Pack Leader
  - key: dark_ranger
    name: Dark Ranger
    markers: [466930] # Black Arrow

abilities:
  bestial_wrath: { id: 19574, name: Bestial Wrath, cooldown_ms: 90000 }
  kill_command: { id: 34026, name: Kill Command, cooldown_ms: 7500, charges: 2 }
  barbed_shot: { id: 217200, name: Barbed Shot, cooldown_ms: 18000, charges: 2 }
  wild_thrash: { id: 1264359, name: Wild Thrash }
  black_arrow: { id: 466930, name: Black Arrow, cooldown_ms: 10000, tree: dark_ranger }
  wailing_arrow: { id: 392060, name: Wailing Arrow, cast_ms: 2000, tree: dark_ranger }
  cobra_shot: { id: 193455, name: Cobra Shot }

buffs: {}

priority:
  pack_leader:
    st:
      - { spell: barbed_shot, note: { pt: "se o Bestial Wrath volta em 3s ou for chegar a 2 cargas", en: "if Bestial Wrath is back in 3s or it would reach 2 charges" } }
      - { spell: bestial_wrath }
      - { spell: kill_command, note: { pt: "com Howl of the Pack Leader ou Nature's Ally", en: "with Howl of the Pack Leader or Nature's Ally" } }
      - { spell: cobra_shot, note: { pt: "com Cobra Fang", en: "with Cobra Fang" } }
      - { spell: barbed_shot }
      - { spell: cobra_shot }
    aoe:
      - { spell: barbed_shot, note: { pt: "no alvo prioritário, antes de 2 cargas", en: "on the priority target, before 2 charges" } }
      - { spell: wild_thrash }
      - { spell: bestial_wrath, note: { pt: "com o Beast Cleave ativo", en: "with Beast Cleave up" } }
      - { spell: kill_command, note: { pt: "com Howl of the Pack Leader ou Nature's Ally", en: "with Howl of the Pack Leader or Nature's Ally" } }
      - { spell: cobra_shot, note: { pt: "com Cobra Fang", en: "with Cobra Fang" } }
      - { spell: barbed_shot, note: { pt: "no alvo prioritário (sem espalhar)", en: "on the priority target (no spreading)" } }
      - { spell: cobra_shot }
  dark_ranger:
    st:
      - { spell: barbed_shot, note: { pt: "se o Bestial Wrath volta em 3s", en: "if Bestial Wrath is back in 3s" } }
      - { spell: bestial_wrath }
      - { spell: kill_command, note: { pt: "com Nature's Ally", en: "with Nature's Ally" } }
      - { spell: black_arrow }
      - { spell: barbed_shot }
      - { spell: wailing_arrow, note: { pt: "sem deixar o Kill Command chegar a 2 cargas", en: "without letting Kill Command reach 2 charges" } }
      - { spell: cobra_shot }
    aoe:
      - { spell: bestial_wrath, note: { pt: "com o Beast Cleave ativo", en: "with Beast Cleave up" } }
      - { spell: wild_thrash }
      - { spell: kill_command, note: { pt: "com Nature's Ally", en: "with Nature's Ally" } }
      - { spell: black_arrow, note: { pt: "na frente do pack (Bleak Powder)", en: "in front of the pack (Bleak Powder)" } }
      - { spell: wailing_arrow }
      - { spell: barbed_shot, note: { pt: "no alvo prioritário", en: "on the priority target" } }
      - { spell: cobra_shot }

# Abertura: Barbed Shot (duas vezes), Bestial Wrath com o pet no alvo e Kill Command
opener:
  window_ms: 8000
  ordered: false
  pack_leader: [barbed_shot, bestial_wrath, kill_command]
  dark_ranger: [black_arrow, barbed_shot, bestial_wrath, kill_command]

checks:
  - kind: downtime
    id: always_be_casting
    gcd_ms: 1200
    min_gap_ms: 800
    importance: high
    title: { pt: "Tempo sem atirar", en: "Time not shooting" }
    tip: { pt: "Tudo é instantâneo: atire andando, e Cobra Shot sempre que não houver nada acima.", en: "Everything is instant: shoot while moving, and Cobra Shot whenever nothing above is up." }
  - kind: cooldown
    id: cooldowns
    spells: [bestial_wrath, kill_command, barbed_shot, black_arrow]
    min_usage: 0.8
    importance: medium
    title: { pt: "Cooldown parado", en: "Cooldown sitting" }
    tip: { pt: "Bestial Wrath no cooldown; Kill Command e Barbed Shot nunca parados com 2 cargas.", en: "Bestial Wrath on cooldown; Kill Command and Barbed Shot never sitting at 2 charges." }
